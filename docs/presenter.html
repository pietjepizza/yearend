      $('deck').classList.remove('shake'); void $('deck').offsetWidth; $('deck').classList.add('shake');
      setTimeout(() => { confetti.burst('cannons'); flashLights(); }, 650);
      timesUp = false;
    }

    // ---------- word bubbles ----------
    let cloudAt = 0, cloudTimer = null;
    function scheduleCloud(s) {
      const wait = 1100 - (Date.now() - cloudAt);
      if (wait <= 0 || fresh) { cloudAt = Date.now(); layoutCloud(s); return; }
      if (!cloudTimer) cloudTimer = setTimeout(() => { cloudTimer = null; cloudAt = Date.now(); if (latest && latest.stage === 'question') layoutCloud(latest); }, wait);
    }
    function layoutCloud(s) {
      const box = $('cloud'), measure = $('measure');
      if (!box) return;
      const entries = Object.entries(s.words).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 30);
      $('cloudEmpty').hidden = entries.length > 0;
      const total = entries.reduce((a, [, c]) => a + c, 0);
      $('wlabel').textContent = total ? `${total} word${total === 1 ? '' : 's'}` : '';
      const W = box.clientWidth, H = box.clientHeight, u = U();
      const hi = entries.length ? entries[0][1] : 1, lo = entries.length ? entries[entries.length - 1][1] : 1;
      const maxF = u * (entries.length > 18 ? 2.3 : entries.length > 9 ? 2.7 : 3.2), minF = u * 1.15, pad = u * .5;
      const placed = [], seen = new Set();
      entries.forEach(([w, n], i) => {
        seen.add(w);
        const t = hi === lo ? (entries.length === 1 ? 1 : .3) : Math.sqrt((n - lo) / (hi - lo));
        const fs = minF + (maxF - minF) * t;
        measure.style.fontSize = fs + 'px'; measure.firstChild.textContent = w;
        const bw = measure.offsetWidth, bh = measure.offsetHeight;
        let pos = null;
        for (let k = 0; k < 2400 && !pos; k++) {
          const a = k * .22, r = u * .3 * a;
          const x = W / 2 + r * Math.cos(a) * 1.35 - bw / 2, y = H / 2 + r * Math.sin(a) * .85 - bh / 2;
          if (x < 0 || y < 0 || x + bw > W || y + bh > H) continue;
          if (placed.some(p => x < p.x + p.w + pad && x + bw + pad > p.x && y < p.y + p.h + pad * .6 && y + bh + pad * .6 > p.y)) continue;
          pos = { x, y, w: bw, h: bh };
        }
        let rec = cloudEls.get(w);
        if (!rec) {
          const el = document.createElement('div');
          el.className = 'w new';
          el.innerHTML = `<i>${esc(w)}</i>`;
          el.style.setProperty('--c', LANES[hash(w) % LANES.length]);
          el.style.setProperty('--d', (hash(w) % 30) / 10 + 's');
          if (T.canControl) { el.title = 'Click to hide this word'; el.onclick = () => T.act('hide', w); }
          box.appendChild(el);
          rec = { el, n };
          cloudEls.set(w, rec);
          if (pos) { el.style.transition = 'none'; el.style.fontSize = fs + 'px'; el.style.transform = `translate(${pos.x}px,${pos.y}px)`; void el.offsetWidth; el.style.transition = ''; }
        } else if (n > rec.n) {
          rec.el.classList.remove('grow', 'new'); void rec.el.offsetWidth; rec.el.classList.add('grow');
        }
        rec.n = n;
        rec.el.classList.toggle('lead', i === 0);
        if (!pos) { rec.el.style.opacity = 0; return; }
        placed.push(pos);
        Object.assign(rec.el.style, { opacity: '', fontSize: fs + 'px', transform: `translate(${pos.x}px,${pos.y}px)` });
      });
      for (const [w, rec] of cloudEls) if (!seen.has(w)) { rec.el.remove(); cloudEls.delete(w); }
    }

    // ---------- SLIDES: the rest of the all-hands deck ----------
    // Layouts: title, agenda, section, bullets, stats, shoutouts, quote, qa. Text in [brackets] is a placeholder.
    const ph = t => esc(t).replace(/\[([^\]]*)\]/g, '<span class="ph">[$1]</span>');

        // count up numeric values; placeholders such as "XX" stay as they are

          const raw = el.dataset.val, m = raw.match(/^([^\d-]*)(-?[\d.,]+)(.*)$/);

        C.innerHTML = `<div class="s-shouts" style="--n:${people.length}">${people.map((p, k) => {
          const ini = String(p.name || '?').replace(/[\[\]]/g, '').split(/\s+/).map(w => w[0] || '').join('').slice(0, 2).toUpperCase() || '★';
          return `<div class="card s-shout" style="--k:${k}">

    // ---------- RECAP: thank you + what we'll do ----------

    // ---------- ROADMAP: the team walks the road ahead ----------
    function buildRoadmap(s) {

    }
    function drawRoad(steps) {
      const box = $('road');

      const W = box.clientWidth, H = box.clientHeight, u = U();
      const y = H * .5;
      const pts = steps.map((st, i) => ({ x: u * 7 + (W - u * 14) * (i / (steps.length - 1)), y }));
      const segs = pts.slice(1).map((b, i) => `M${pts[i].x} ${y} L${b.x} ${y}`);
      const glyph = st => st.type === 'start' ? '<i class="now"></i>'
        : st.type === 'rest' ? icon('help:snow')
        : st.type === 'boss' ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L14.6 8.6 L21.5 9.2 L16.2 13.7 L17.9 20.5 L12 16.8 L6.1 20.5 L7.8 13.7 L2.5 9.2 L9.4 8.6 Z" fill="currentColor"/></svg>'
        : st.type === 'finish' ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 L10 17.5 L19.5 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        : `<b>${steps.slice(0, steps.indexOf(st) + 1).filter(x => x.type === 'level').length}</b>`;
      box.innerHTML = `
        <svg class="road-svg" viewBox="0 0 ${W} ${H}" aria-hidden="true">
          <path class="road-bed" d="M${pts[0].x} ${y} L${pts[pts.length - 1].x} ${y}"/>
          <path class="road-done" id="roadDone" d="M${pts[0].x} ${y} L${pts[pts.length - 1].x} ${y}"/>
          ${segs.map((d, i) => `<path class="seg-measure" id="seg${i}" d="${d}"/>`).join('')}
        </svg>
        ${steps.map((st, i) => `
          <div class="stop ${st.type} ${i === 0 ? 'first' : i === steps.length - 1 ? 'last' : ''}" id="stop${i}" style="left:${pts[i].x}px;top:${y}px;--c:${LANES[i % LANES.length]}">
            <div class="dot">${glyph(st)}</div>
            <div class="stem ${i % 2 ? 'below' : 'above'}"></div>
            <div class="scard ${i % 2 ? 'below' : 'above'}">
              <span class="when">${esc(st.when || '')}</span>

        <div class="walker" id="walker"><i></i></div>`;
      walk(steps, pts);
    }
    function walk(steps, pts) {
      const lens = steps.slice(1).map((_, i) => $('seg' + i).getTotalLength());
      const totalLen = lens.reduce((a, b) => a + b, 0);
      const done = $('roadDone'), walker = $('walker');
      done.style.strokeDasharray = `${totalLen} ${totalLen}`;
      done.style.strokeDashoffset = totalLen;
      const place = (i, len) => {
        const p = $('seg' + i).getPointAtLength(len);
        walker.style.transform = `translate(${p.x}px, ${p.y}px)`;
      };
      walker.style.transform = `translate(${pts[0].x}px, ${pts[0].y}px)`;
      const reach = i => {
        const stop = $('stop' + i);
        if (!stop) return;
        stop.classList.add('reached');
        const st = steps[i];
        pulse.spike(st.type === 'boss' ? 1 : .7);
        if (st.type === 'boss' || st.type === 'finish') flashLights();
        if (st.type === 'finish') walker.classList.add('arrived');
      };
      let seg = 0, acc = 0;
      const startWalk = () => {
        walker.classList.add('moving');
        const dur = 1400, t0 = performance.now();
        const step = t => {
          if (!walker.isConnected) return;
          const k = Math.min(1, (t - t0) / dur), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
          place(seg, lens[seg] * e);
          done.style.strokeDashoffset = totalLen - (acc + lens[seg] * e);
          if (k < 1) return requestAnimationFrame(step);
          acc += lens[seg]; seg++;
          walker.classList.remove('moving');
          reach(seg);
          if (seg < lens.length) later(startWalk, steps[seg].type === 'boss' ? 1600 : 1100);
        };
        requestAnimationFrame(step);
      };
      later(() => reach(0), 700);
      later(startWalk, 1700);
    }

    // ---------- FINALE: yes we can! ----------
    function buildFinale(s) {
      const F = s.finale || {};
      $('titleblock').innerHTML = '';
      $('content').innerHTML = `
        <div class="finale">
          <div class="lines">${(F.lines || []).map((l, i) => `<div class="fline" style="--k:${i};--c:${LANES[(i * 2 + 1) % LANES.length]}">${esc(l)}</div>`).join('')}</div>
          <div class="yes" id="yes">${bouncy(F.title || 'YES WE CAN!', 'huge')}</div>
          <div class="fthanks">${esc(F.thanks || '')}</div>
          <div class="parade" id="parade"></div>
        </div>`;
      $('source').textContent = 'Tap cheer on your phone!';
      $('ticker').innerHTML = (F.lines || []).map(l => `<span>${esc(l)}</span>`).join('');
      const nLines = (F.lines || []).length;
      (F.lines || []).forEach((_, i) => later(() => { flashLights(); pulse.spike(1); }, 600 + i * 900));
      later(() => {
        $('yes').classList.add('go');
        fireworks.start(); confetti.burst('cannons'); flashLights();
        $('deck').classList.remove('shake'); void $('deck').offsetWidth; $('deck').classList.add('shake');
      }, 700 + nLines * 900);
      [4, 8, 12].forEach(k => later(() => { confetti.burst(k % 8 ? 'top' : 'cannons'); flashLights(); }, (700 + nLines * 900) + k * 1000));
    }
    function paintFinale(s) {
      const box = $('parade');
      if (!box || box.dataset.done) return;
      box.dataset.done = '1';
      const players = (s.players || []).slice(-40);
      const crew = players.length >= 12 ? players : Array.from({ length: 28 }, (_, i) => ({ a: i, n: i * 3, c: i % 6 }));
      box.innerHTML = crew.map((p, i) => `<i style="--i:${i};--c:${LANES[p.c % LANES.length]}"></i>`).join('');
    }

    // ---------- reactions ----------
    function onReact(r) { if (!r) return; FX.floatReaction(r); pulse.spike(.45); if (view === 'finale') flashLights(); }

    // ---------- controls ----------
    let resetArmed = 0, clearArmed = 0;
    function control(a) {
      if (a === 'snow') { const on = snow.toggle(); $('ctlSnow').textContent = on ? 'Snow on' : 'Snow off'; return; }
      if (a === 'sim') { const on = T.simulate(!T.simulating()); $('ctlSim').textContent = on ? '■ Stop simulation' : '▶ Simulate the room'; return; }
      if (!T.canControl) { $('status').textContent = T.controlHint || 'Only the presenter can control this screen'; return; }
      if (a === 'reveal') { if (!latest || latest.stage !== 'question') return; a = latest.revealed ? 'conceal' : 'reveal'; }
      if (a === 'reset') {
        if (Date.now() - resetArmed > 3000) { resetArmed = Date.now(); $('ctlReset').textContent = 'Click again to reset'; setTimeout(() => ($('ctlReset').textContent = 'Reset'), 3000); return; }
        resetArmed = 0; $('ctlReset').textContent = 'Reset';
      }
      if (a === 'clear') {
        if (Date.now() - clearArmed > 3000) { clearArmed = Date.now(); FX.toast($('toast'), 'Press C again to clear this question', 2800); return; }
        clearArmed = 0;
      }
      T.act(a);
    }
    $('controls').addEventListener('click', e => { const b = e.target.closest('button'); if (b) control(b.dataset.a); });
    if (T.simulate) $('ctlSim').hidden = false;
    let idleT;
    addEventListener('mousemove', () => {
      document.body.classList.add('show-controls');
      clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.remove('show-controls'), 2600);
    });
    addEventListener('keydown', e => {
      if (e.target.closest && e.target.closest('input,textarea')) return;
      const k = e.key.toLowerCase();
      if (['arrowright', ' ', 'pagedown'].includes(k)) { e.preventDefault(); control('next'); }
      else if (['arrowleft', 'pageup'].includes(k)) control('prev');
      else if (k === 'h') control('reveal');
      else if (k === 's') control('snow');
      else if (k === 'u') control('unhide');
      else if (k === 'c') control('clear');
    });
    addEventListener('resize', () => {
      if (!latest) return;
      if (latest.stage === 'question') layoutCloud(latest);
      if (latest.stage === 'roadmap') { timers.forEach(clearTimeout); timers = []; drawRoad((latest.roadmap || {}).steps || []); }
    });
    document.fonts && document.fonts.ready.then(() => latest && latest.stage === 'question' && layoutCloud(latest));

    T.onStatus = msg => ($('status').textContent = msg || '');
    T.subscribe(render, onReact);
  }

<script>
// Participant (phone) view. mountJoin(rootElement, transport).
(function (root) {

  const SHELL = `

  function mountJoin(rootEl, T) {
    rootEl.innerHTML = SHELL;
    const $ = id => document.getElementById(id);
    new FX.Snow($('barSnow'), { rgb: '255,255,255', intensity: 3 });

    const myColor = LANES[me.c % LANES.length];
    const myName = PulseCore.playerName(me);

      $('tbar').classList.toggle('hurry', rem < 5500);
      if (rem <= 0) { tOn = false; $('tbar').hidden = true; return; }

      s = await T.getState();

        $('word').value = s.mine ? s.mine.word : '';

    }

    $('send').onclick = async () => {

<script>
// Transport for the claude.ai test build.
// - Presenter state lives in the shared `db` document live/state (only editors can change it).
// - Each phone writes one anonymous document votes/<random token>; the presenter subscribes to them.
// - Reactions and "who is connected" travel over the live `room`.
// - Without db/room (signed out, or a local preview), tabs in the same browser sync via BroadcastChannel.
// - The presenter can also simulate a full room, so the whole flow can be tested alone.
(function (root) {
  root.ArtifactTransport = function (config, role, joinUrl, opts = {}) {
    const sfx = opts.slot ? '-' + opts.slot : '';   // separate identities for several phones in one browser (simulator)
    const Core = root.PulseCore;
    const S = config.questions.length, LAST = Core.lastIndex(config);
    const qiNow = () => Core.qiAt(config, control.current);
    const store = {
      get(k) { try { return localStorage.getItem(k); } catch { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    };
    let token = store.get('mp-id' + sfx);
    if (!token) { token = 'p' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); store.set('mp-id' + sfx, token); }
    let mine = null;
    try { mine = JSON.parse(store.get('mp-mine' + sfx) || 'null'); } catch {}
    if (!mine || typeof mine !== 'object') mine = { epoch: null, answers: {} };
    let me = null;
    try { me = JSON.parse(store.get('mp-player' + sfx) || 'null'); } catch {}
    if (!me) { me = Core.makePlayer(); store.set('mp-player' + sfx, JSON.stringify(me)); }
    me = Core.cleanPlayer(me);

    const DEFAULT = { current: 0, revealedQ: {}, timerEnd: 0, hidden: [], epoch: 'e0', cleared: {}, rev: 0 };
    let control = { ...DEFAULT };
    let votes = {};                // token -> { epoch, answers: { [qi]: { option, word, ts } } }
    let phonesHere = 0, roomPlayers = [], localPhones = new Map();
    let db = null, room = null, sim = null;
    const subs = { state: [], react: [] };
    let bc = null;
    try { bc = new BroadcastChannel('mood-pulse-demo'); } catch {}

    // ---------- state ----------
    function stateObj() {
      const responses = {}, cleared = control.cleared || {};
      const add = (tok, qi, a) => { if (a && a.ts > (cleared[qi] || 0)) (responses[qi] ||= {})[tok] = a; };
      for (const [tok, v] of Object.entries(votes)) {
        if (!v || v.epoch !== control.epoch) continue;
        for (const [qi, a] of Object.entries(v.answers || {})) add(tok, qi, a);
      }
      if (sim) for (const [bot, ans] of Object.entries(sim.answers)) for (const [qi, a] of Object.entries(ans)) add(bot, qi, a);
      return { current: control.current, revealedQ: control.revealedQ || {}, timerEnd: control.timerEnd || 0, hidden: control.hidden || [], responses };
    }
    const publicState = () => Core.publicState(config, stateObj(), {
      joinUrl, connected: phonesHere + (sim ? sim.connected : 0),
      players: [...roomPlayers, ...(sim ? sim.players.slice(0, sim.connected) : [])].slice(-80),
    });
    let emitQueued = false, pendingPop = null;
    function emit(meta = {}) {
      if (meta.pop) pendingPop = meta.pop;
      if (emitQueued) return;
      emitQueued = true;
      queueMicrotask(() => {
        emitQueued = false;
        const s = publicState(), m = pendingPop ? { pop: pendingPop } : {};
        pendingPop = null;
        subs.state.forEach(f => f(s, m));
      });
    }

    // ---------- presenter actions ----------
    let writing = Promise.resolve();
    function writeControl() {
      const snapshot = { ...control };
      writing = writing.then(async () => {
        if (db) {
          try { await db.doc('live/state').set(snapshot); }
          catch (e) { T.onStatus && T.onStatus(e && e.code === 'invalid_argument' ? (opts.controlHint || 'Only editors of this page can control the presenter screen') : 'Could not save the presenter state, retrying on the next action'); }
        }
        if (bc) bc.postMessage({ t: 'control', control: snapshot });
      });
    }
    function act(a, word) {
      const c = { ...control, hidden: [...(control.hidden || [])], cleared: { ...(control.cleared || {}) }, revealedQ: { ...(control.revealedQ || {}) } };
      if (a === 'next') Core.enter(config, c, Math.min(c.current + 1, LAST));
      else if (a === 'prev') Core.enter(config, c, Math.max(c.current - 1, 0));
      else if (a === 'goto') Core.enter(config, c, Number(word) || 0);
      else if (a === 'reveal') { const qi = Core.qiAt(config, c.current); if (qi >= 0) c.revealedQ[qi] = true; c.timerEnd = 0; }
      else if (a === 'conceal') { delete c.revealedQ[Core.qiAt(config, c.current)]; c.timerEnd = 0; }
      else if (a === 'hide') { const w = Core.norm(word); if (w && !c.hidden.includes(w)) c.hidden.push(w); }
      else if (a === 'unhide') c.hidden = [];
      else if (a === 'clear') { const qi = Core.qiAt(config, c.current); if (qi < 0) return; c.cleared[qi] = Date.now(); delete c.revealedQ[qi]; Core.enter(config, c, c.current); if (sim) for (const b of Object.values(sim.answers)) delete b[qi]; }
      else if (a === 'reset') { Object.assign(c, DEFAULT, { epoch: 'e' + Date.now().toString(36), rev: c.rev }); if (sim) { sim.answers = {}; } }
      else return;
      c.rev = (control.rev || 0) + 1;
      control = c;
      emit();
      writeControl();
    }

    // ---------- phone actions ----------
    async function vote(index, option, word) {
      const qi = qiNow();
      if (index !== control.current || qi < 0) return 'moved';
      if (mine.epoch !== control.epoch) mine = { epoch: control.epoch, answers: {} };
      mine.answers[qi] = { option, word: Core.clean(word, 24), ts: Date.now() };
      store.set('mp-mine' + sfx, JSON.stringify(mine));
      const body = { epoch: mine.epoch, answers: mine.answers };
      if (db) {
        try { await db.doc('votes/' + token).set(body); }
        catch (e) { return 'error'; }
      }
      if (bc) bc.postMessage({ t: 'vote', token, v: body });
      return 'ok';
    }
    function react(r) {
      if (room) room.emit('react', { r }).catch(() => {});
      if (bc) bc.postMessage({ t: 'react', r });
    }
    function getState() {
      const s = publicState();
      const qi = s.qi, a = mine.answers[qi];
      s.mine = s.stage === 'question' && mine.epoch === control.epoch && a && a.ts > ((control.cleared || {})[qi] || 0) ? a : null;
      return Promise.resolve(s);
    }

    // ---------- same-browser fallback ----------
    if (bc) bc.onmessage = ({ data: m }) => {
      if (!m || typeof m !== 'object') return;
      if (role === 'host') {
        if (m.t === 'vote' && !db && m.v && typeof m.token === 'string') {
          const prev = votes[m.token], a = m.v.answers && m.v.answers[qiNow()], pa = prev && prev.answers && prev.answers[qiNow()];
          votes[m.token] = m.v;
          emit(a && (!pa || pa.ts !== a.ts) ? { pop: a.option } : {});
        }
        if (m.t === 'react' && !room && config.reactions.includes(m.r)) subs.react.forEach(f => f(m.r));
        if (m.t === 'here' && !room) { localPhones.set(m.token, { t: Date.now(), p: Core.cleanPlayer(m.p) }); countLocal(); }
        if (m.t === 'hello' && !db) bc.postMessage({ t: 'control', control });
      } else if (m.t === 'control' && !db && m.control) { control = { ...DEFAULT, ...m.control }; emit(); }
    };
    function countLocal() {
      const now = Date.now();
      for (const [k, v] of localPhones) if (now - v.t > 12000) localPhones.delete(k);
      const list = [...localPhones.values()].map(v => v.p);
      if (list.length !== phonesHere || JSON.stringify(list) !== JSON.stringify(roomPlayers)) { phonesHere = list.length; roomPlayers = list; emit(); }
    }
    if (bc && role === 'phone') { bc.postMessage({ t: 'hello' }); const here = () => bc.postMessage({ t: 'here', token, p: me }); here(); setInterval(here, 5000); }
    if (role === 'host') setInterval(() => { if (!room) countLocal(); }, 4000);

    // ---------- claude.ai capabilities ----------
    (async () => {
      const use = name => (!opts.local && root.claude && typeof root.claude.use === 'function' ? root.claude.use(name).catch(() => null) : Promise.resolve(null));
      const [dbNs, roomNs, user] = opts.backend ? [opts.backend.db, opts.backend.room, opts.backend.user] : await Promise.all([use('db'), use('room'), use('user')]);
      db = dbNs; room = roomNs;
      if (role === 'host' && user && typeof user.canEdit === 'function') {
        try { const can = await user.canEdit(); if (can === false) { T.canControl = false; T.controlHint = opts.controlHint || 'Only editors of this page can control the presenter screen'; } } catch {}
      }
      if (db) {
        const timer = setTimeout(() => T.onStatus && T.onStatus('Waiting for the shared session data…'), 10000);
        db.doc('live/state').onSnapshot(snap => {
          clearTimeout(timer); T.onStatus && T.onStatus('');
          if (!snap.exists) return;
          const d = snap.data() || {};
          if (role === 'host' && (d.rev || 0) < (control.rev || 0)) return; // an older echo of our own writes
          control = { ...DEFAULT, ...d };
          emit();
        }, () => { clearTimeout(timer); });
        if (role === 'host') {
          let first = true;
          db.collection('votes').onSnapshot(qs => {
            let pop = null;
            for (const ch of qs.docChanges()) {
              if (ch.type === 'removed') { delete votes[ch.doc.id]; continue; }
              const d = ch.doc.data(), prev = votes[ch.doc.id];
              votes[ch.doc.id] = d;
              const a = d && d.answers && d.answers[qiNow()], pa = prev && prev.answers && prev.answers[qiNow()];
              if (a && d.epoch === control.epoch && (!pa || pa.ts !== a.ts)) pop = a.option;
            }
            emit(pop && !first ? { pop } : {});
            first = false;
          }, () => {});
        }
      } else if (role === 'host') {
        if (!opts.local) T.onStatus && T.onStatus('Test mode: phones in this browser only. Sign in to claude.ai to connect other devices.');
        if (bc) setTimeout(() => bc.postMessage({ t: 'control', control }), 300);
      }
      if (room) {
        if (role === 'host') room.on('react', msg => { const r = msg && msg.data && msg.data.r; if (config.reactions.includes(r)) subs.react.forEach(f => f(r)); }, () => {});
        if (role === 'phone') room.presence({ role: 'phone', p: me }).catch(() => {});
        room.onPeers(ch => {
          const phones = ch.peers.filter(p => p.presence && p.presence.role === 'phone');
          phonesHere = phones.length;
          roomPlayers = phones.map(p => Core.cleanPlayer(p.presence.p));
          emit();
        }, () => {});
      }
      emit();
    })();

    // ---------- room simulator (presenter only) ----------
    function weighted(q) {
      const w = (q.demo && q.demo.weights) || q.options.map(() => 1);
      const total = w.reduce((a, b) => a + b, 0);
      let r = Math.random() * total;
      for (let i = 0; i < q.options.length; i++) { r -= w[i] || 0; if (r < 0) return q.options[i].id; }
      return q.options[0].id;
    }
    function simTick() {
      if (!sim) return;
      if (sim.connected < sim.target && Math.random() < .7) { sim.connected += Math.random() < .3 ? 2 : 1; emit(); }
      const qi = qiNow(), stage = Core.steps(config)[Math.max(0, Math.min(LAST, control.current))].kind;
      if (qi >= 0 && Math.random() < .62) {
        const q = config.questions[qi];
        const open = [];
        for (let k = 0; k < sim.connected; k++) if (!(sim.answers['bot' + k] || {})[qi]) open.push(k);
        if (open.length) {
          const k = open[(Math.random() * open.length) | 0], words = (q.demo && q.demo.words) || [];
          const option = weighted(q);
          (sim.answers['bot' + k] ||= {})[qi] = { option, word: words.length && Math.random() < .68 ? words[(Math.random() * words.length) | 0] : '', ts: Date.now() };
          emit({ pop: option });
        }
      }
      const party = stage === 'finale' || stage === 'recap';
      if (Math.random() < (party ? .5 : qi >= 0 ? .14 : .08)) {
        const n = 1 + ((Math.random() * (party ? 4 : 2)) | 0);
        for (let i = 0; i < n; i++) setTimeout(() => subs.react.forEach(f => f(config.reactions[(Math.random() * config.reactions.length) | 0])), i * 140);
      }
    }
    const SPEED = { calm: 650, normal: 280, busy: 110 };
    function simulate(on, o = {}) {
      if (on) {
        const target = o.size || (sim ? sim.target : 36 + ((Math.random() * 12) | 0));
        if (!sim) sim = { answers: {}, connected: 0, target, players: [] };
        sim.target = target;
        while (sim.players.length < target) sim.players.push(Core.makePlayer());
        if (sim.connected > target) sim.connected = target;
        clearInterval(sim.timer);
        sim.timer = setInterval(simTick, SPEED[o.speed] || sim.interval || SPEED.normal);
        if (o.speed) sim.interval = SPEED[o.speed];
      }
      else if (sim) { clearInterval(sim.timer); sim = null; }
      emit();
      return !!sim;
    }
    const simReact = r => subs.react.forEach(f => f(r));

    const T = {
      me,
      joinUrl, joinLabel: joinUrl ? 'Scan with your phone camera' : 'Open this page with #join on your phone',
      canControl: true,
      controlHint: '',
      qrHtml: () => '',
      subscribe(onState, onReact) { subs.state.push(onState); if (onReact) subs.react.push(onReact); emit(); },
      act, vote, react, getState,
      simulate: role === 'host' && !opts.noSim ? simulate : undefined,
      simulating: () => !!sim,
      simReact: role === 'host' ? simReact : undefined,
    };
    return T;
  };
})(typeof self !== 'undefined' ? self : this);

</script>
<script>
// Entry point for the claude.ai test build: "" shows the phone view, anything else the presenter screen.
// Inside the simulator, window.SIM = { role: 'host' | 'phone', slot } picks the view instead, runs fully
// locally (no shared database), and the presenter exposes window.__sim for the simulator's control panel.
(function () {
  const app = document.getElementById('app');
  const SIM = window.SIM || null;
  const LIVE = window.PULSE_LIVE || null;   // { url, key, role }: the static website talking to Supabase
  const isPhone = SIM ? SIM.role === 'phone' : LIVE && LIVE.role ? LIVE.role === 'phone' : location.hash === '#join';
  if (!SIM && !LIVE) addEventListener('hashchange', () => location.reload());
  const config = window.PULSE_CONFIG;
  let opts = {};
  if (SIM) opts = { local: true, slot: SIM.slot };
  else if (LIVE && window.SupabaseBackend) {
    const params = new URLSearchParams(location.search);
    opts = {
      backend: SupabaseBackend({ url: LIVE.url, key: LIVE.key, hostKey: isPhone ? '' : params.get('key') || '' }),
      controlHint: 'View only: open this page with ?key=<presenter key> to control it',
      noSim: params.get('sim') !== '1',
    };
  }
  const T = ArtifactTransport(config, isPhone ? 'phone' : 'host', window.PULSE_JOIN_URL || '', opts);
  const qr = document.getElementById('qr-template');
  T.qrHtml = () => (qr ? qr.innerHTML : '<div style="color:#0b0b3b;font:600 13px/1.4 Inter,sans-serif;padding:8px">Open this page with #join on your phone</div>');
  if (SIM && !isPhone) T.joinLabel = SIM.label || 'Simulator: vote on the phones beside this screen';
  if (isPhone) mountJoin(app, T); else mountHost(app, T);

  if (SIM && !isPhone) {
    window.__sim = {
      act: (a, arg) => T.act(a, arg),
      goto: i => T.act('goto', i),
      simulate: (on, o) => T.simulate(on, o),
      simulating: () => T.simulating(),
      react: r => T.simReact(r),
      setTimer: sec => { config.timer = sec; config.questions.forEach(q => delete q.timer); },
      onState: cb => T.subscribe(cb),
      stages: () => PulseCore.steps(config).map((st, i) => ({ i, kind: st.kind, label: PulseCore.navLabel(config, st),
        title: st.kind === 'question' ? config.questions[st.qi].title : st.kind === 'slide' ? st.slide.title : '' })),
      reactions: config.reactions,
    };
  }
})();

</script>
