<script>
// Live backend for the static website (GitHub Pages), built on Supabase.
// It offers the small db / room / user surface that ArtifactTransport already uses:
//   db.doc('live/state')      → table pulse_state (row 'main'), written via rpc pulse_set_state (needs the presenter key)
//   db.collection('votes')    → table pulse_votes, live through Postgres changes
//   db.doc('votes/<token>')   → rpc pulse_vote
//   room                      → a Supabase Realtime channel: broadcast for reactions, presence for "who is connected"
// Needs the supabase-js UMD build loaded first (global `supabase`).
(function (root) {
  root.SupabaseBackend = function ({ url, key, hostKey = '', roomName = 'pulse-room', presenceKey }) {
    const sb = root.supabase.createClient(url, key, { auth: { persistSession: false }, realtime: { params: { eventsPerSecond: 20 } } });
    const fail = (code, e) => { const err = new Error((e && e.message) || code); err.code = code; throw err; };
    const voteDoc = r => ({ id: r.token, data: () => ({ epoch: r.epoch, answers: r.answers || {} }) });

    // If the realtime connection (a WebSocket) cannot be opened, for example on a network that blocks
    // WebSockets, fall back to polling so the screen and the votes keep flowing.
    function withFallback(channel, load, everyMs) {
      let live = false, timer = null;
      const startPolling = () => { if (!timer && !live) timer = setInterval(load, everyMs); };
      const stopPolling = () => { clearInterval(timer); timer = null; };
      channel.subscribe(status => {
        if (status === 'SUBSCRIBED') { live = true; stopPolling(); load(); }
        else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') { live = false; startPolling(); }
      });
      setTimeout(startPolling, 4000);
      load();
      return () => { stopPolling(); sb.removeChannel(channel); };
    }

    function stateRef() {
      return {
        onSnapshot(next, onError) {
          let lastAt = '';
          const deliver = (data, at) => { if (at && at === lastAt) return; lastAt = at || lastAt; next({ exists: !!data, data: () => data, metadata: { fromCache: false } }); };
          const load = async () => {
            const { data, error } = await sb.from('pulse_state').select('data,updated_at').eq('id', 'main').maybeSingle();
            if (error) { if (onError) onError({ code: 'unavailable', message: error.message }); return; }
            deliver(data && data.data, data && data.updated_at);
          };
          const ch = sb.channel('pulse-state-' + Math.random().toString(36).slice(2, 8))
            .on('postgres_changes', { event: '*', schema: 'public', table: 'pulse_state' }, p => {
              const row = p.new;
              if (row && row.id === 'main') deliver(row.data, row.updated_at);
            });
          return withFallback(ch, load, 2000);
        },
        async set(obj) {
          const { error } = await sb.rpc('pulse_set_state', { p_key: hostKey, p_data: obj });
          if (error) fail(error.code === '42501' ? 'invalid_argument' : 'unavailable', error);
        },
      };
    }

    const db = {
      doc(path) {
        if (path === 'live/state') return stateRef();
        if (path.startsWith('votes/')) {
          const token = path.slice(6);
          return {
            async set(body) {
              const { error } = await sb.rpc('pulse_vote', { p_token: token, p_epoch: String(body.epoch || ''), p_answers: body.answers || {} });
              if (error) fail('unavailable', error);
            },
          };
        }
        throw new TypeError('Unknown document ' + path);
      },
      collection(path) {
        if (path !== 'votes') throw new TypeError('Unknown collection ' + path);
        return {
          onSnapshot(next) {
            const known = new Map();   // token -> updated_at
            let first = true;
            const emit = changes => { if (changes.length || first) next({ docChanges: () => changes }); first = false; };
            const load = async () => {
              const { data, error } = await sb.from('pulse_votes').select('token,epoch,answers,updated_at').limit(2000);
              if (error || !data) return;
              const changes = [], seen = new Set();
              for (const r of data) {
                seen.add(r.token);
                if (known.get(r.token) === r.updated_at) continue;
                changes.push({ type: known.has(r.token) ? 'modified' : 'added', doc: voteDoc(r) });
                known.set(r.token, r.updated_at);
              }
              for (const id of [...known.keys()]) if (!seen.has(id)) { known.delete(id); changes.push({ type: 'removed', doc: { id, data: () => ({}) } }); }
              emit(changes);
            };
            const ch = sb.channel('pulse-votes-' + Math.random().toString(36).slice(2, 8))
              .on('postgres_changes', { event: '*', schema: 'public', table: 'pulse_votes' }, p => {
                if (p.eventType === 'DELETE') {
                  const id = p.old && p.old.token;
                  if (id && known.has(id)) { known.delete(id); emit([{ type: 'removed', doc: { id, data: () => ({}) } }]); }
                  return;
                }
                const r = p.new;
                if (known.get(r.token) === r.updated_at) return;
                const t = known.has(r.token) ? 'modified' : 'added';
                known.set(r.token, r.updated_at);
                emit([{ type: t, doc: voteDoc(r) }]);
              });
            return withFallback(ch, load, 1500);
          },
        };
      },
    };

    // ---- room: reactions (broadcast) + who is connected (presence) ----
    const ch = sb.channel(roomName, { config: { broadcast: { self: false }, presence: { key: presenceKey || Math.random().toString(36).slice(2) } } });
    const listeners = {}, peerSubs = [];
    let mine = null, joined = false;
    ch.on('broadcast', { event: 'react' }, ({ payload }) => (listeners.react || []).forEach(f => f({ topic: 'react', data: payload })));
    ch.on('presence', { event: 'sync' }, () => {
      const peers = Object.values(ch.presenceState()).flat().map(meta => ({ presence: meta }));
      peerSubs.forEach(f => f({ peers, joined: [], left: [], updated: [] }));
    });
    ch.subscribe(async status => { if (status === 'SUBSCRIBED') { joined = true; if (mine) await ch.track(mine); } });
    const room = {
      on(topic, fn) { (listeners[topic] ||= []).push(fn); return () => { listeners[topic] = listeners[topic].filter(x => x !== fn); }; },
      emit(topic, data) { return ch.send({ type: 'broadcast', event: topic, payload: data }).then(() => {}); },
      presence(obj) { mine = { ...(mine || {}), ...obj }; return joined ? ch.track(mine).then(() => {}) : Promise.resolve(); },
      onPeers(fn) { peerSubs.push(fn); return () => {}; },
    };

    const user = { canEdit: async () => !!hostKey };
    return { db, room, user };
  };
})(typeof self !== 'undefined' ? self : this);

</script>

<title>Mood Pulse</title>

<style>
/* =====================================================================
   Peak Season Pulse: ASML-blue "light show" style
   A deep blue stage with slow light-blue glows and a faint wafer grid,
   glassy cards, clean type, blue characters and gold only for winners.
   Provisional ASML-inspired palette: swap exact brand values here.
   ===================================================================== */
:root {
  --bg: #07062f;           /* deepest navy */
  --brand: #10069f;        /* ASML-style deep blue */
  --brand-2: #2a1fd1;
  --blue: #3b6fff;
  --sky: #5fb8ff;          /* light blue accent */
  --ice: #8fd3ff;
  --gold: #ffc400;         /* winners only */
  --fg: #ffffff;
  --fg-2: rgba(255, 255, 255, .74);
  --fg-3: rgba(255, 255, 255, .5);
  --glass: rgba(255, 255, 255, .07);
  --glass-2: rgba(255, 255, 255, .13);
  --line: rgba(255, 255, 255, .18);
  --ink: #0b0b3b;          /* character outlines */

  --display: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  --body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.2, 1.4, .4, 1);

  --u: min(1vw, 1.7778vh);   /* 1u = 1% of a 16:9 stage */
  --r: calc(var(--u) * 1.2);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--body); color: var(--fg); background: var(--bg); -webkit-font-smoothing: antialiased; font-feature-settings: 'tnum' 1; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--sky); outline-offset: 3px; }
svg { display: block; }
[hidden] { display: none !important; }

/* =====================================================================
   SHARED: light orbs + icons
   ===================================================================== */
.orb { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 0 6px rgba(95, 184, 255, .45)); }
.orb .halo { transform-box: fill-box; transform-origin: center; animation: halo 3.2s ease-in-out infinite; animation-delay: var(--d, 0s); }
@keyframes halo { 0%, 100% { transform: scale(.92); opacity: .12; } 50% { transform: scale(1.05); opacity: .22; } }

.ico .b { fill-opacity: .22; }
.ico .b.on { fill-opacity: 1; }
.ico .ln { stroke-dasharray: 1; }
.ico .bolt { display: none; }
.ico .h { transform-box: fill-box; transform-origin: center; }

/* =====================================================================
   PRESENTER STAGE (16:9, scales with the viewport)
   ===================================================================== */
body.presenting { height: 100vh; overflow: hidden; background: #03021a; }
.deck {
  width: calc(var(--u) * 100); height: calc(var(--u) * 56.25);
  margin: auto; position: absolute; inset: 0; overflow: hidden;
  display: grid; grid-template-rows: auto auto 1fr auto;
  padding: calc(var(--u) * 3.4) calc(var(--u) * 3) calc(var(--u) * 1.4);
  background:
    linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px) 0 0 / calc(var(--u) * 3.2) calc(var(--u) * 3.2),
    linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px) 0 0 / calc(var(--u) * 3.2) calc(var(--u) * 3.2),
    linear-gradient(155deg, var(--brand) 0%, #0b0770 38%, var(--bg) 100%);
}
.deck > * { position: relative; z-index: 2; }
.deck > .rays, .deck > .snow, .deck > .backdrop, .deck > .fireworks { position: absolute; z-index: 0; }
.backdrop { inset: 0; overflow: hidden; pointer-events: none; }
.backdrop i { position: absolute; width: 60%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, var(--c) 0%, transparent 66%); opacity: .38; animation: drift 30s ease-in-out infinite alternate; }
.backdrop i:nth-child(1) { --c: #3b6fff; left: -18%; top: -30%; }
.backdrop i:nth-child(2) { --c: #5fb8ff; right: -22%; top: -25%; animation-duration: 36s; animation-delay: -6s; opacity: .3; }
.backdrop i:nth-child(3) { --c: #2a1fd1; left: 20%; bottom: -55%; animation-duration: 27s; animation-delay: -12s; }
.backdrop i:nth-child(4) { --c: #8fd3ff; right: -25%; bottom: -50%; animation-duration: 40s; animation-delay: -3s; opacity: .2; }
.backdrop i:nth-child(5) { --c: #6a5cff; left: 35%; top: -45%; width: 45%; animation-duration: 33s; animation-delay: -18s; opacity: .25; }
@keyframes drift { 0% { transform: translate(0, 0) scale(1); } 33% { transform: translate(10%, 7%) scale(1.12); } 66% { transform: translate(-7%, 12%) scale(.92); } 100% { transform: translate(5%, -8%) scale(1.08); } }
.rays { inset: -60%; background: repeating-conic-gradient(from 0deg, rgba(143, 211, 255, .06) 0 6deg, transparent 6deg 18deg); animation: spin 120s linear infinite; opacity: 0; transition: opacity 1.2s; }
.deck[data-stage="lobby"] .rays, .deck[data-stage="finale"] .rays { opacity: 1; }
.snow, .fireworks { inset: 0; width: 100%; height: 100%; pointer-events: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.deck.shake { animation: shake .5s cubic-bezier(.36, .07, .19, .97); }
@keyframes shake { 20%, 60% { transform: translate(-.35%, .2%); } 40%, 80% { transform: translate(.35%, -.2%); } }

/* fairy lights */
.deck > .lights { position: absolute; z-index: 3; left: 0; right: 0; top: 0; height: calc(var(--u) * 3); pointer-events: none; }
.lights .wire { position: absolute; inset: 0; width: 100%; height: 100%; }
.lights .wire path { fill: none; stroke: rgba(255, 255, 255, .28); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.lights i { position: absolute; width: calc(var(--u) * .55); height: calc(var(--u) * .55); margin-left: calc(var(--u) * -.275); border-radius: 50%; background: var(--c); box-shadow: 0 0 calc(var(--u) * .8) calc(var(--u) * .15) var(--c); animation: twinkle 2.6s ease-in-out infinite; animation-delay: var(--d); }
@keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .35; box-shadow: none; } }
.lights.flash i { animation: flash .8s ease-out; }
@keyframes flash { 0% { transform: scale(1.8); opacity: 1; box-shadow: 0 0 calc(var(--u) * 2) calc(var(--u) * .4) var(--c); } }

/* top bar */
.topbar { display: flex; align-items: center; gap: calc(var(--u) * 1.2); font-size: calc(var(--u) * 1); font-weight: 600; }
.tag { font-family: var(--display); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--sky); }
.event { color: var(--fg-2); padding-left: calc(var(--u) * 1.2); border-left: 1px solid var(--line); }
.pulse { width: calc(var(--u) * 11); height: calc(var(--u) * 2.2); }
.topbar .spacer { flex: 1; }
.holiday { display: inline-flex; align-items: center; gap: .5em; background: var(--glass); border: 1px solid var(--line); padding: .3em .9em .3em .55em; border-radius: 999px; color: var(--fg); }
.holiday:empty { display: none; }
.holiday .ico { width: 1.8em; height: 1.25em; color: var(--ice); }
.holiday .ico .h { animation: spin 9s linear infinite; }
.live { display: inline-flex; align-items: center; gap: .5em; font-family: var(--display); font-weight: 600; letter-spacing: .12em; }
.live i { width: .6em; height: .6em; border-radius: 50%; background: #ff4d6d; box-shadow: 0 0 0 0 rgba(255, 77, 109, .6); animation: livepulse 1.8s infinite; }
@keyframes livepulse { 70% { box-shadow: 0 0 0 .7em rgba(255, 77, 109, 0); } 100% { box-shadow: none; } }

/* glass cards */
.card { background: var(--glass); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 calc(var(--u) * 1) calc(var(--u) * 3) rgba(0, 0, 20, .35), inset 0 1px 0 rgba(255, 255, 255, .08); padding: calc(var(--u) * 1.2) calc(var(--u) * 1.5); position: relative; min-height: 0; min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 1em; font-size: calc(var(--u) * .95); color: var(--fg-3); font-weight: 600; margin-bottom: calc(var(--u) * .8); }
.card-h b { font-family: var(--display); font-weight: 600; font-size: 1.3em; color: var(--fg); letter-spacing: .01em; }

/* titles */
.titleblock { padding: calc(var(--u) * 1.6) 0 calc(var(--u) * 1.4); }
.bouncy { font-family: var(--display); font-weight: 700; margin: 0; line-height: 1.02; font-size: calc(var(--u) * 4.4); letter-spacing: -.02em; display: flex; flex-wrap: wrap; }
.bouncy span { display: inline-block; color: var(--fg); }
.bouncy .word { display: inline-flex; }
.bouncy .word:last-child span { color: var(--sky); }
.bouncy .sp { width: .28em; }
.bouncy.mid { font-size: calc(var(--u) * 3.8); }
.bouncy.huge { font-size: calc(var(--u) * 9); justify-content: center; }
.entering .bouncy span:not(.sp):not(.word) { animation: letterin .7s var(--ease) both; animation-delay: calc(var(--i) * 35ms); }
@keyframes letterin { from { transform: translateY(.5em); opacity: 0; filter: blur(6px); } }
.sub { font-size: calc(var(--u) * 1.35); font-weight: 500; color: var(--fg-2); margin: calc(var(--u) * .9) 0 0; max-width: calc(var(--u) * 70); }
.sub b { font-family: var(--display); color: var(--fg); }
.entering .sub { animation: fadeup .7s var(--ease) both .4s; }
@keyframes fadeup { from { opacity: 0; transform: translateY(calc(var(--u) * 1)); } }

.qrow { display: grid; grid-template-columns: auto 1fr auto; gap: calc(var(--u) * 1.6); align-items: center; }
.qbadge { width: calc(var(--u) * 6); height: calc(var(--u) * 6); border-radius: 50%; background: linear-gradient(145deg, var(--blue), var(--brand)); border: 1px solid rgba(255, 255, 255, .3); display: grid; place-content: center; text-align: center; box-shadow: 0 0 calc(var(--u) * 2) rgba(59, 111, 255, .45); }
.qbadge b { font-family: var(--display); font-size: calc(var(--u) * 2.1); line-height: 1; }
.qbadge span { font-size: calc(var(--u) * .85); font-weight: 600; color: var(--fg-2); }
.entering .qbadge { animation: spinin .8s var(--spring) both; }
@keyframes spinin { from { transform: rotate(-120deg) scale(0); } }
.qtext h1 { font-family: var(--display); font-weight: 600; font-size: calc(var(--u) * 2.9); line-height: 1.1; margin: 0; letter-spacing: -.015em; text-wrap: balance; }
.entering .qtext h1 { animation: fadeup .6s var(--ease) both .15s; }
.ctx { display: inline-block; margin-top: calc(var(--u) * .6); background: var(--glass-2); border: 1px solid var(--line); color: var(--fg-2); font-weight: 600; font-size: calc(var(--u) * .95); padding: .2em .9em; border-radius: 999px; }

.timer { width: calc(var(--u) * 7); height: calc(var(--u) * 7); position: relative; display: grid; place-items: center; }
.timer svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.timer .t-bg { fill: rgba(255, 255, 255, .06); stroke: rgba(255, 255, 255, .15); stroke-width: 6; }
.timer .t-fg { fill: none; stroke: var(--sky); stroke-width: 7; stroke-dasharray: 100; stroke-linecap: round; filter: drop-shadow(0 0 4px rgba(95, 184, 255, .7)); transition: stroke .3s; }
.timer b { position: relative; font-family: var(--display); font-weight: 700; font-size: calc(var(--u) * 2.7); }
.timer b.tick { animation: tickpop .35s var(--spring); }
@keyframes tickpop { from { transform: scale(1.4); } }
.timer.hurry .t-fg { stroke: var(--gold); filter: drop-shadow(0 0 5px rgba(255, 196, 0, .8)); }
.timer.hurry { animation: hurry .5s ease-in-out infinite; }
.timer.done { opacity: .45; }
@keyframes hurry { 50% { transform: scale(1.08); } }

.banner { margin-top: calc(var(--u) * 1.1); display: inline-block; font-family: var(--display); font-weight: 600; font-size: calc(var(--u) * 1.8); padding: .3em .9em; border-radius: calc(var(--u) * .8); max-width: 100%; }
.banner.hint { background: var(--glass); border: 1px solid var(--line); color: var(--fg-2); font-family: var(--body); font-weight: 600; font-size: calc(var(--u) * 1.3); }
.banner.result { background: linear-gradient(90deg, var(--blue), var(--brand-2)); border: 1px solid rgba(255, 255, 255, .3); font-size: calc(var(--u) * 2.1); box-shadow: 0 0 calc(var(--u) * 2.5) rgba(59, 111, 255, .5); }
.banner.result .hl { color: var(--gold); }
.banner .wd { display: inline-block; }
.banner.in { animation: fadeup .55s var(--ease) both; }
.banner.result.in .wd { animation: letterin .5s var(--ease) both; animation-delay: calc(var(--w) * 45ms + .25s); }

/* stage wipe: a sweep of light between screens */
.wipe { position: fixed; inset: 0; z-index: 65; pointer-events: none; overflow: hidden; }
.wipe i { position: absolute; top: -20%; bottom: -20%; left: 0; width: 40%; transform: translateX(-150vw) skewX(-14deg); }
.wipe i:nth-child(1) { background: #10069f; --k: 0; }
.wipe i:nth-child(2) { background: #2a1fd1; --k: 1; }
.wipe i:nth-child(3) { background: #3b6fff; --k: 2; }
.wipe i:nth-child(4) { background: #5fb8ff; --k: 3; }
.wipe i:nth-child(5) { background: #0b0770; --k: 4; }
.wipe.go i { animation: wipe-x 1.05s cubic-bezier(.7, 0, .3, 1) forwards; animation-delay: calc(var(--k) * 55ms); }
@keyframes wipe-x { 0% { transform: translateX(-150vw) skewX(-14deg); } 45%, 55% { transform: translateX(calc(var(--k) * 30vw - 30vw)) skewX(-14deg); width: 60%; } 100% { transform: translateX(160vw) skewX(-14deg); } }
.entering .st { animation: rise .75s var(--ease) both; animation-delay: calc(var(--i, 0) * 110ms + 150ms); }
@keyframes rise { from { transform: translateY(calc(var(--u) * 3)); opacity: 0; } }

#content { min-height: 0; display: flex; flex-direction: column; }

/* ---------- lobby ---------- */
.lobby { flex: 1; display: grid; grid-template-columns: 1fr calc(var(--u) * 22); grid-template-rows: 1fr auto; gap: calc(var(--u) * 1.6) calc(var(--u) * 2); min-height: 0; }
.how { display: flex; flex-direction: column; }
.steps { flex: 1; display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; gap: calc(var(--u) * 1); }
.step { display: flex; flex-direction: column; align-items: center; text-align: center; gap: calc(var(--u) * .3); position: relative; }
.entering .step { animation: rise .7s var(--ease) both; animation-delay: calc(var(--k) * 300ms + .5s); }
.step .num { position: absolute; top: 0; left: 18%; width: calc(var(--u) * 2.4); height: calc(var(--u) * 2.4); border-radius: 50%; background: var(--sky); color: var(--bg); font-family: var(--display); font-weight: 700; font-size: calc(var(--u) * 1.3); display: grid; place-items: center; z-index: 2; }
.sico { width: calc(var(--u) * 8); height: calc(var(--u) * 9); display: grid; place-items: center; position: relative; }
.sico .phone-ico { height: 100%; animation: phonewiggle 2.6s ease-in-out infinite; }
.phone-ico rect:first-child { fill: #e8f1ff; }
.phone-ico .scanline { stroke: var(--sky); animation: scan 1.4s ease-in-out infinite; }
@keyframes scan { 50% { transform: translateY(18px); } }

.sico .orb { width: 70%; }
.race-ico { width: calc(var(--u) * 5.6); height: calc(var(--u) * 5.6); margin: calc(var(--u) * 1.7) 0; }
.race-ico .orb { width: 100%; }
.race-ico .crown { position: absolute; inset: -12%; width: 124%; opacity: 1; transform: none; }
.step b { font-family: var(--display); font-weight: 600; font-size: calc(var(--u) * 1.45); }
.step span { font-weight: 500; font-size: calc(var(--u) * .95); color: var(--fg-3); }
.arrow { width: calc(var(--u) * 4); height: 2px; background: repeating-linear-gradient(90deg, var(--ice) 0 calc(var(--u) * .7), transparent calc(var(--u) * .7) calc(var(--u) * 1.2)); position: relative; animation: arrowmove .9s linear infinite; }
.arrow::after { content: ''; position: absolute; right: calc(var(--u) * -.5); top: 50%; border: calc(var(--u) * .5) solid transparent; border-left-color: var(--ice); transform: translateY(-50%); }
@keyframes arrowmove { to { background-position: calc(var(--u) * 1.2) 0; } }

.join-card { grid-row: 1 / 3; grid-column: 2; display: flex; flex-direction: column; align-items: center; text-align: center; justify-content: center; gap: calc(var(--u) * .8); background: linear-gradient(160deg, rgba(59, 111, 255, .35), rgba(16, 6, 159, .35)); }

.call { animation: callglow 2.4s ease-in-out infinite; }
@keyframes callglow { 0%, 100% { box-shadow: 0 0 0 0 rgba(95, 184, 255, .45), 0 calc(var(--u) * 1) calc(var(--u) * 3) rgba(0, 0, 20, .35); } 60% { box-shadow: 0 0 0 calc(var(--u) * 1) rgba(95, 184, 255, 0), 0 calc(var(--u) * 1) calc(var(--u) * 3) rgba(0, 0, 20, .35); } }

.players { display: flex; align-items: center; gap: calc(var(--u) * 1.6); min-height: calc(var(--u) * 7.5); overflow: hidden; }
.players-n { display: flex; flex-direction: column; align-items: center; flex: none; }
.players-n span { font-family: var(--display); font-weight: 700; font-size: calc(var(--u) * 3.8); line-height: 1; }
.players-n small { font-size: calc(var(--u) * .85); font-weight: 600; color: var(--fg-3); }
.chips { display: flex; flex-wrap: wrap; gap: calc(var(--u) * .5) calc(var(--u) * .7); max-height: calc(var(--u) * 5.6); overflow: hidden; }
.chips-empty { font-weight: 500; color: var(--fg-3); font-size: calc(var(--u) * 1.05); }
.chip { display: inline-flex; align-items: center; gap: .35em; background: var(--glass-2); border: 1px solid var(--line); border-radius: 999px; padding: .15em .8em .15em .2em; font-weight: 600; font-size: calc(var(--u) * .95); }
.chip .orb { width: calc(var(--u) * 2.1); filter: none; }
.chip.pop { animation: chipin .6s var(--spring) both; }
@keyframes chipin { from { transform: scale(0); opacity: 0; } }

/* ---------- question ---------- */
.body { flex: 1; display: grid; grid-template-columns: 1.35fr 1fr; gap: calc(var(--u) * 2); min-height: 0; }
.race { display: flex; flex-direction: column; }
.lanes { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; gap: calc(var(--u) * .5); }
.lane { display: grid; grid-template-columns: calc(var(--u) * 12.5) 1fr calc(var(--u) * 5.4); align-items: center; gap: calc(var(--u) * .9); }
.entering .lane { animation: rise .6s var(--ease) both; animation-delay: calc(var(--i) * 90ms + .35s); }
.badge { display: flex; align-items: center; gap: calc(var(--u) * .5); min-width: 0; }
.badge .ic { flex: none; width: calc(var(--u) * 2.6); color: var(--c); }
.badge .lab { font-weight: 600; font-size: calc(var(--u) * 1.1); line-height: 1.15; }
.track { position: relative; height: calc(var(--u) * 2.6); background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .12); border-radius: 999px; --rw: calc(var(--u) * 4.4); }
.trail { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; width: calc((100% - var(--rw)) * var(--f, 0) + var(--rw) * .6); background: linear-gradient(90deg, color-mix(in srgb, var(--c) 25%, transparent), var(--c)); box-shadow: 0 0 calc(var(--u) * 1.2) color-mix(in srgb, var(--c) 60%, transparent); transition: width .9s var(--spring); overflow: hidden; }
.racing .trail::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 20%, rgba(255, 255, 255, .45) 50%, transparent 80%); animation: sweep 1.3s linear infinite; }
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.track .flag { position: absolute; right: calc(var(--u) * -.3); top: 50%; height: calc(var(--u) * 3.6); transform: translateY(-62%); opacity: .8; }
.flag path:nth-child(2) { fill: #fff; stroke: var(--ink); }
.runner { position: absolute; top: 50%; width: var(--rw); margin-top: calc(var(--rw) / -2); left: calc((100% - var(--rw)) * var(--f, 0)); transition: left .9s var(--spring); z-index: 2; }
.runner .body-wrap { transform-origin: 50% 50%; }
.racing .runner .body-wrap { animation: orbpulse 1.4s ease-in-out infinite; animation-delay: var(--d, 0s); }
@keyframes orbpulse { 50% { transform: scale(1.08); filter: brightness(1.2); } }
.runner.hop .body-wrap { animation: flare .6s var(--ease); }
@keyframes flare { 0% { transform: scale(1.4); filter: brightness(1.8); } 100% { transform: none; filter: none; } }
@keyframes hopidle { 50% { transform: translateY(calc(var(--u) * -.4)); } }
.plus { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); font-family: var(--display); font-weight: 700; color: var(--ice); font-size: calc(var(--u) * 1.2); animation: plus 1s ease-out forwards; pointer-events: none; }
@keyframes plus { to { transform: translate(-50%, calc(var(--u) * -2)); opacity: 0; } }
.crown { position: absolute; left: -14%; top: -14%; width: 128%; opacity: 0; transform: scale(1.7); z-index: 3; overflow: visible; filter: drop-shadow(0 0 5px rgba(255, 196, 0, .75)); pointer-events: none; }
.crown .ring-dash { transform-box: fill-box; transform-origin: center; animation: spin 9s linear infinite; }
.bubble { position: absolute; bottom: 18%; right: calc(100% + var(--u) * .9); white-space: nowrap; background: #fff; color: var(--ink); border-radius: calc(var(--u) * .9); padding: .2em .75em; font-family: var(--display); font-weight: 600; font-size: calc(var(--u) * 1.1); opacity: 0; transform: scale(0); transform-origin: 100% 50%; z-index: 4; box-shadow: 0 calc(var(--u) * .4) calc(var(--u) * 1.4) rgba(0, 0, 20, .4); }
.pct { font-family: var(--display); font-weight: 700; font-size: calc(var(--u) * 2.1); text-align: right; transition: opacity .3s; }
.lane.top .crown { animation: ringin .7s var(--ease) .3s forwards; }
@keyframes ringin { to { opacity: 1; transform: none; } }
.lane.top .bubble { animation: bubblein .5s var(--spring) .8s forwards; }
@keyframes bubblein { to { opacity: 1; transform: rotate(-2deg); } }
.lane.top .track { border-color: rgba(255, 196, 0, .6); box-shadow: 0 0 0 calc(var(--u) * .25) rgba(255, 196, 0, .18); }
.lane.top .pct { color: var(--gold); }
.lane.top .lab { color: var(--fg); }
.concealed .pct { opacity: 0; }
.concealed .lane.top .crown, .concealed .lane.top .bubble { animation: none; opacity: 0; }
.concealed .lane.top .track { border-color: rgba(255, 255, 255, .12); box-shadow: none; }
.concealed .lane.top .pct { color: var(--fg); }

.right { display: grid; grid-template-rows: 1fr auto; gap: calc(var(--u) * 1.6); min-height: 0; }
.words { display: flex; flex-direction: column; }
.cloud { flex: 1; position: relative; min-height: 0; }
.cloud .w { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1; transition: transform .9s var(--spring), font-size .9s var(--ease), opacity .4s; }
.cloud .w i { display: block; font-style: normal; font-family: var(--display); font-weight: 600; background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); color: var(--fg); border-radius: 999px; padding: .18em .6em .22em; animation: float 3.4s ease-in-out infinite; animation-delay: var(--d); }
.cloud .w.lead i { background: var(--c); color: var(--bg); box-shadow: 0 0 calc(var(--u) * 1.5) color-mix(in srgb, var(--c) 70%, transparent); }
.cloud .w.new i { animation: bubblepop .7s var(--spring), float 3.4s ease-in-out infinite .7s; }
.cloud .w.grow i { animation: grow .55s var(--spring), float 3.4s ease-in-out infinite .55s; }
@keyframes float { 50% { transform: translateY(calc(var(--u) * -.3)); } }
@keyframes bubblepop { from { transform: scale(0); opacity: 0; } }
@keyframes grow { 40% { transform: scale(1.22); } }
.cloud.can-edit .w { cursor: pointer; }
.cloud.can-edit .w:hover i { text-decoration: line-through; opacity: .6; }
.cloud-empty { position: absolute; inset: calc(var(--u) * 3) 0 0; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 500; color: var(--fg-3); font-size: calc(var(--u) * 1.25); line-height: 1.45; animation: breathe 2.6s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .5; } }

.minis { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 1.6); }
.mini { display: flex; flex-direction: column; align-items: center; text-align: center; padding: calc(var(--u) * .9) calc(var(--u) * 1); }
.mini-k { font-family: var(--display); font-weight: 600; font-size: calc(var(--u) * 1.15); color: var(--fg-2); }
.gauge { width: 82%; margin-top: calc(var(--u) * .4); overflow: visible; }
.gauge .seg { fill: none; stroke-width: 11; }
.needle { transform-origin: 60px 62px; transform: rotate(var(--a, 0deg)); transition: transform 1.2s var(--spring); }
.concealed .needle { animation: wiggle 1.2s ease-in-out infinite; }
@keyframes wiggle { 0%, 100% { transform: rotate(-30deg); } 50% { transform: rotate(30deg); } }
.mini-v { font-family: var(--display); font-weight: 700; font-size: calc(var(--u) * 2.1); line-height: 1; margin-top: calc(var(--u) * .3); }
.mini-v small { font-size: .5em; color: var(--fg-3); }
.leader { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * .3); font-weight: 600; font-size: calc(var(--u) * 1.05); line-height: 1.15; }
.leader .orb { width: calc(var(--u) * 4.4); }
.leader .q, .mini-v span:only-child { font-family: var(--display); font-size: calc(var(--u) * 3.2); color: var(--fg-3); }
.qr-mini { background: linear-gradient(160deg, rgba(59, 111, 255, .3), rgba(16, 6, 159, .3)); }
.qr-mini .qr { width: calc(var(--u) * 8.2); background: #fff; padding: calc(var(--u) * .5); border-radius: calc(var(--u) * .5); margin: calc(var(--u) * .4) 0; }
.mini-n { font-weight: 600; font-size: calc(var(--u) * 1); color: var(--fg-2); }
.mini-n b { font-family: var(--display); font-size: 1.4em; color: var(--fg); }

/* footer ticker */
.foot { display: grid; grid-template-columns: auto 1fr auto; gap: calc(var(--u) * 1.2); align-items: center; margin-top: calc(var(--u) * 1.6); border-top: 1px solid var(--line); padding-top: calc(var(--u) * .8); font-size: calc(var(--u) * .95); font-weight: 600; color: var(--fg-2); }
.foot-k { color: var(--sky); font-family: var(--display); letter-spacing: .04em; }
.ticker { overflow: hidden; white-space: nowrap; mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent); }
.ticker-in { display: inline-block; animation: tick 40s linear infinite; padding-left: 100%; }
.ticker span { margin-right: calc(var(--u) * 2.2); color: var(--fg); }
.ticker span::before { content: '◆'; color: var(--sky); margin-right: .5em; font-size: .7em; vertical-align: .15em; }
.ticker span.joke { color: var(--ice); font-style: italic; }
.ticker span.joke::before { content: '▸'; color: var(--gold); font-style: normal; }
@keyframes tick { to { transform: translateX(-100%); } }
.pager { font-family: var(--display); color: var(--fg); }

/* ---------- recap ---------- */
.final { display: grid; grid-template-columns: repeat(var(--cols, 4), 1fr); gap: calc(var(--u) * 1.6); flex: 1; min-height: 0; }
.fcard { display: flex; flex-direction: column; gap: calc(var(--u) * .7); padding-top: 0; overflow: hidden; }
.fhead { margin: 0 calc(var(--u) * -1.5) calc(var(--u) * .2); background: linear-gradient(90deg, color-mix(in srgb, var(--c) 45%, transparent), transparent); border-bottom: 1px solid var(--line); padding: calc(var(--u) * .6) calc(var(--u) * 1.5); font-family: var(--display); font-weight: 600; font-size: calc(var(--u) * 1.2); letter-spacing: .04em; text-transform: uppercase; }
.fwin { display: flex; align-items: center; gap: calc(var(--u) * .9); }
.fwin b { display: block; font-family: var(--display); font-weight: 600; font-size: calc(var(--u) * 1.35); line-height: 1.15; }
.fwin span { font-weight: 600; color: var(--gold); font-size: calc(var(--u) * .95); }
.fblob { position: relative; width: calc(var(--u) * 4.2); flex: none; }
.fblob .crown { opacity: 1; transform: none; }
.ft { font-weight: 500; font-size: calc(var(--u) * 1.1); line-height: 1.35; color: var(--fg-2); }

.fchips { display: flex; flex-wrap: wrap; gap: calc(var(--u) * .4); }
.fchips span { background: var(--glass-2); border: 1px solid var(--line); border-radius: 999px; padding: .1em .65em; font-weight: 600; font-size: calc(var(--u) * .9); }
.entering .fchips span { animation: chipin .5s var(--spring) both; animation-delay: calc(var(--i) * 110ms + var(--k) * 90ms + 1s); }
.pledge { margin-top: auto; background: rgba(95, 184, 255, .12); border: 1px solid rgba(95, 184, 255, .4); border-radius: calc(var(--u) * .7); padding: calc(var(--u) * .6) calc(var(--u) * .8); font-weight: 600; font-size: calc(var(--u) * 1); line-height: 1.35; }
.pledge .stamp { display: inline-block; background: var(--sky); color: var(--bg); font-family: var(--display); font-weight: 700; border-radius: 999px; padding: 0 .6em; margin-right: .5em; font-size: .9em; }
.entering .pledge { animation: stampin .55s var(--spring) both; animation-delay: calc(var(--k) * 300ms + 1.6s); }
@keyframes stampin { from { transform: scale(1.3); opacity: 0; } }
.final-band { margin-top: calc(var(--u) * 1.6); display: grid; grid-template-columns: repeat(3, auto) 1fr; gap: calc(var(--u) * 3.4); align-items: center; background: linear-gradient(90deg, rgba(59, 111, 255, .35), rgba(16, 6, 159, .3)); border: 1px solid var(--line); border-radius: var(--r); padding: calc(var(--u) * 1) calc(var(--u) * 2); }
.stat { display: flex; flex-direction: column; }
.stat .v { font-family: var(--display); font-weight: 700; font-size: calc(var(--u) * 2.6); line-height: 1; }
.stat .v small { font-size: .45em; color: var(--fg-3); }
.stat .k { font-weight: 600; font-size: calc(var(--u) * .9); color: var(--fg-2); }
.thanks { text-align: right; font-family: var(--display); font-weight: 600; font-size: calc(var(--u) * 1.7); line-height: 1.2; }

/* ---------- road ahead: a straight roadmap with a travelling light pulse ---------- */
.roadmap { flex: 1; display: flex; padding: calc(var(--u) * .8); }
.road-box { flex: 1; position: relative; min-height: 0; }
.road-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.road-bed { fill: none; stroke: rgba(255, 255, 255, .16); stroke-width: calc(var(--u) * .35); stroke-linecap: round; }
.road-done { fill: none; stroke: var(--sky); stroke-width: calc(var(--u) * .35); stroke-linecap: round; filter: drop-shadow(0 0 5px rgba(95, 184, 255, .9)); }
.seg-measure { fill: none; stroke: none; }
.stop { position: absolute; transform: translate(-50%, -50%); z-index: 2; }
.stop .dot { position: relative; width: calc(var(--u) * 3.6); height: calc(var(--u) * 3.6); border-radius: 50%; border: 1px solid rgba(255, 255, 255, .3); background: #12106a; color: var(--fg-3); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: calc(var(--u) * 1.4); transition: background .5s, color .5s, box-shadow .5s, border-color .5s; }
.stop .dot svg, .stop .dot .ico { width: 58%; height: auto; }
.stop .dot .now { width: 34%; aspect-ratio: 1; border-radius: 50%; background: currentColor; }
.stop.boss .dot { width: calc(var(--u) * 4.4); height: calc(var(--u) * 4.4); border-color: rgba(255, 196, 0, .7); color: var(--gold); }
.stop.finish .dot { width: calc(var(--u) * 4.4); height: calc(var(--u) * 4.4); }
.stop .dot::after { content: ''; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--sky); opacity: 0; }
.stop.reached .dot { background: var(--blue); color: #fff; border-color: rgba(255, 255, 255, .6); box-shadow: 0 0 calc(var(--u) * 1.6) rgba(95, 184, 255, .8); }
.stop.reached .dot::after { animation: ripple 1.2s var(--ease) forwards; }
.stop.reached.boss .dot { background: #3a2a00; color: var(--gold); border-color: var(--gold); box-shadow: 0 0 calc(var(--u) * 2) rgba(255, 196, 0, .6); }
.stop.reached.boss .dot::after { border-color: var(--gold); }
.stop.reached.finish .dot { background: var(--sky); color: var(--bg); }
@keyframes ripple { from { transform: scale(1); opacity: .9; } to { transform: scale(2.4); opacity: 0; } }
.stem { position: absolute; left: 50%; width: 1px; height: calc(var(--u) * 3.4); background: linear-gradient(var(--line), rgba(255, 255, 255, .45)); transform: scaleY(0); }
.stem.above { bottom: 100%; transform-origin: 50% 100%; }
.stem.below { top: 100%; transform-origin: 50% 0; background: linear-gradient(rgba(255, 255, 255, .45), var(--line)); }
.stop.reached .stem { animation: stem .45s var(--ease) forwards; }
@keyframes stem { to { transform: scaleY(1); } }
.scard { position: absolute; left: 50%; width: calc(var(--u) * 14); transform: translate(-50%, 0); opacity: 0; background: rgba(12, 10, 80, .82); border: 1px solid var(--line); border-top: 2px solid var(--c); border-radius: calc(var(--u) * .7); box-shadow: 0 calc(var(--u) * .8) calc(var(--u) * 2) rgba(0, 0, 20, .4); padding: calc(var(--u) * .7) calc(var(--u) * .9); text-align: left; display: flex; flex-direction: column; gap: .25em; }
.scard.above { bottom: calc(100% + var(--u) * 3.4); }
.scard.below { top: calc(100% + var(--u) * 3.4); }
.scard .when { font-weight: 600; font-size: calc(var(--u) * .85); color: var(--c); letter-spacing: .02em; }
.scard b { font-family: var(--display); font-weight: 600; font-size: calc(var(--u) * 1.4); line-height: 1.15; }
.scard .snote { font-weight: 500; font-size: calc(var(--u) * .92); color: var(--fg-2); line-height: 1.35; }
.stop.boss .scard { border-top-color: var(--gold); }
.stop.boss .scard .when, .stop.boss .scard b { color: var(--gold); }
.stop.reached .scard { animation: cardin .6s var(--ease) .25s forwards; }
.stop .scard.above { --from: calc(var(--u) * 1); }
.stop .scard.below { --from: calc(var(--u) * -1); }
@keyframes cardin { from { opacity: 0; transform: translate(-50%, var(--from)); } to { opacity: 1; transform: translate(-50%, 0); } }
.stop.first .scard { left: calc(var(--u) * -1.8); }
.stop.last .scard { left: auto; right: calc(var(--u) * -1.8); }
.stop.first.reached .scard, .stop.last.reached .scard { animation-name: cardin-edge; }
@keyframes cardin-edge { from { opacity: 0; transform: translate(0, var(--from)); } to { opacity: 1; transform: none; } }
.stop.first .scard, .stop.last .scard { transform: none; }
.walker { position: absolute; left: 0; top: 0; z-index: 5; pointer-events: none; }
.walker i { position: absolute; width: calc(var(--u) * 1.4); height: calc(var(--u) * 1.4); margin: calc(var(--u) * -.7) 0 0 calc(var(--u) * -.7); border-radius: 50%; background: #fff; box-shadow: 0 0 calc(var(--u) * 1) calc(var(--u) * .3) var(--sky), 0 0 calc(var(--u) * 3) calc(var(--u) * .8) rgba(95, 184, 255, .6); }
.walker.moving i::before { content: ''; position: absolute; right: 50%; top: 50%; width: calc(var(--u) * 7); height: calc(var(--u) * .5); transform: translateY(-50%); border-radius: 999px; background: linear-gradient(90deg, transparent, rgba(143, 211, 255, .85)); }
.walker.arrived i { animation: arrive 1.6s ease-in-out infinite; }
@keyframes arrive { 50% { box-shadow: 0 0 calc(var(--u) * 1.4) calc(var(--u) * .5) var(--gold), 0 0 calc(var(--u) * 4) calc(var(--u) * 1) rgba(255, 196, 0, .5); } }
.entering .road-box { animation: fadein .6s both .2s; }
@keyframes fadein { from { opacity: 0; } }

/* ---------- deck slides ---------- */
.ph { color: var(--ice); background: rgba(143, 211, 255, .12); border: 1px dashed rgba(143, 211, 255, .5); border-radius: .3em; padding: 0 .25em; font-style: normal; }
.deck[data-layout="title"] .rays, .deck[data-layout="section"] .rays, .deck[data-layout="qa"] .rays { opacity: 1; }

.s-title, .s-qa { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: calc(var(--u) * 1.4); padding-left: calc(var(--u) * 2); }
.s-kicker { font-family: var(--display); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--sky); font-size: calc(var(--u) * 1.4); }
.bouncy.xl { font-size: calc(var(--u) * 6.8); line-height: 1; }
.s-sub { font-family: var(--display); font-weight: 500; font-size: calc(var(--u) * 2.2); color: var(--fg-2); margin: 0; max-width: calc(var(--u) * 70); }
.s-meta { font-weight: 600; font-size: calc(var(--u) * 1.2); color: var(--fg-3); padding-top: calc(var(--u) * 1); border-top: 1px solid var(--line); }
.entering .s-kicker { animation: fadeup .6s var(--ease) both .1s; }
.entering .s-sub { animation: fadeup .7s var(--ease) both .8s; }
.entering .s-meta { animation: fadeup .7s var(--ease) both 1.1s; }

.s-section { flex: 1; position: relative; display: flex; align-items: center; gap: calc(var(--u) * 4); padding-left: calc(var(--u) * 2); overflow: hidden; }
.s-num { font-family: var(--display); font-weight: 700; font-size: calc(var(--u) * 20); line-height: .9; color: transparent; -webkit-text-stroke: max(2px, calc(var(--u) * .18)) rgba(143, 211, 255, .85); text-shadow: 0 0 calc(var(--u) * 4) rgba(95, 184, 255, .35); }
.entering .s-num { animation: numin 1s var(--ease) both; }
@keyframes numin { from { transform: translateX(calc(var(--u) * -6)); opacity: 0; filter: blur(10px); } }
.s-sec-text .sub { font-size: calc(var(--u) * 1.8); }
.s-beam { position: absolute; left: 0; right: 0; bottom: 18%; height: 2px; background: linear-gradient(90deg, transparent, var(--sky), transparent); box-shadow: 0 0 12px var(--sky); transform: scaleX(0); }
.entering .s-beam { animation: beam 1.4s var(--ease) both .5s; }
@keyframes beam { to { transform: scaleX(1); } }

.s-agenda { flex: 1; display: flex; align-items: center; }
.s-agenda ol { list-style: none; margin: 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: calc(var(--u) * .5); }
.s-agenda li { display: grid; grid-template-columns: calc(var(--u) * 9) 1fr auto; align-items: center; gap: calc(var(--u) * 1.4); padding: calc(var(--u) * .9) calc(var(--u) * 1.2); border-radius: calc(var(--u) * .8); background: rgba(255, 255, 255, .04); border: 1px solid rgba(255, 255, 255, .08); }
.entering .s-agenda li { animation: slidein .6s var(--ease) both; animation-delay: calc(var(--k) * 120ms + .4s); }
@keyframes slidein { from { opacity: 0; transform: translateX(calc(var(--u) * -3)); } }
.s-agenda .time { font-family: var(--display); font-weight: 600; font-size: calc(var(--u) * 1.5); color: var(--sky); }
.s-agenda .what b { display: block; font-family: var(--display); font-weight: 600; font-size: calc(var(--u) * 1.7); }
.s-agenda .what small { font-size: calc(var(--u) * 1.05); color: var(--fg-3); font-weight: 500; }
.live-tag { font-size: calc(var(--u) * .9); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--bg); background: var(--sky); border-radius: 999px; padding: .3em .9em; box-shadow: 0 0 calc(var(--u) * 1) rgba(95, 184, 255, .6); }

.s-points { flex: 1; display: grid; grid-template-columns: repeat(min(var(--n), 4), 1fr); gap: calc(var(--u) * 1.6); align-content: center; }
.s-point { display: flex; flex-direction: column; gap: calc(var(--u) * .7); padding: calc(var(--u) * 1.8) calc(var(--u) * 1.6); border-top: 2px solid var(--c); min-height: calc(var(--u) * 20); }
.entering .s-point { animation: rise .7s var(--ease) both; animation-delay: calc(var(--k) * 220ms + .5s); }
.s-ico { width: calc(var(--u) * 5.2); }
.s-point b { font-family: var(--display); font-weight: 600; font-size: calc(var(--u) * 1.9); line-height: 1.15; }
.s-point p { margin: 0; font-size: calc(var(--u) * 1.2); line-height: 1.45; color: var(--fg-2); }

.s-stats { flex: 1; display: grid; grid-template-columns: repeat(min(var(--n), 4), 1fr); gap: calc(var(--u) * 1.6); align-content: center; }
.s-stat { display: flex; flex-direction: column; gap: calc(var(--u) * .5); padding: calc(var(--u) * 2) calc(var(--u) * 1.6); min-height: calc(var(--u) * 18); justify-content: flex-end; position: relative; overflow: hidden; }
.s-stat::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--c); box-shadow: 0 0 14px var(--c); }
.entering .s-stat { animation: rise .7s var(--ease) both; animation-delay: calc(var(--k) * 180ms + .4s); }
.s-val { font-family: var(--display); font-weight: 700; font-size: calc(var(--u) * 5.2); line-height: 1; letter-spacing: -.03em; }
.s-lab { font-weight: 600; font-size: calc(var(--u) * 1.3); color: var(--fg); }
.s-note { font-size: calc(var(--u) * 1.05); color: var(--gold); font-weight: 600; }

.s-shouts { flex: 1; display: grid; grid-template-columns: repeat(min(var(--n), 4), 1fr); gap: calc(var(--u) * 1.6); align-content: center; }
.s-shout { display: flex; flex-direction: column; align-items: center; text-align: center; gap: calc(var(--u) * .5); padding: calc(var(--u) * 2) calc(var(--u) * 1.4); }
.entering .s-shout { animation: flipin .8s var(--ease) both; animation-delay: calc(var(--k) * 220ms + .5s); }
@keyframes flipin { from { opacity: 0; transform: perspective(800px) rotateY(70deg) translateY(calc(var(--u) * 2)); } }
.s-avatar { position: relative; width: calc(var(--u) * 7); margin-bottom: calc(var(--u) * .6); }
.s-avatar .crown { opacity: 0; }
.entering .s-avatar .crown { animation: ringin .7s var(--ease) forwards; animation-delay: calc(var(--k) * 220ms + 1.2s); }
.s-shout b { font-family: var(--display); font-weight: 600; font-size: calc(var(--u) * 1.8); }
.s-team { font-size: calc(var(--u) * 1); font-weight: 600; color: var(--sky); text-transform: uppercase; letter-spacing: .08em; }
.s-shout p { margin: calc(var(--u) * .4) 0 0; font-size: calc(var(--u) * 1.15); line-height: 1.45; color: var(--fg-2); }

.s-quote { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 calc(var(--u) * 8); }
.s-qmark { font-family: var(--display); font-size: calc(var(--u) * 12); line-height: .6; color: var(--sky); opacity: .7; }
.s-quote blockquote { margin: 0; font-family: var(--display); font-weight: 500; font-size: calc(var(--u) * 3.4); line-height: 1.25; }
.s-by { margin-top: calc(var(--u) * 1.6); font-weight: 600; color: var(--fg-2); font-size: calc(var(--u) * 1.4); }
.entering .s-quote blockquote { animation: fadeup .9s var(--ease) both .2s; }

.s-qa { align-items: center; text-align: center; padding-left: 0; }
.s-qa .bouncy { justify-content: center; }
.s-qa-orbs { display: flex; gap: calc(var(--u) * 1.4); margin-bottom: calc(var(--u) * 1); }
.s-qa-orbs span { width: calc(var(--u) * 3.6); animation: hopidle 1.6s ease-in-out infinite; animation-delay: calc(var(--k) * 160ms); }
.s-text { font-size: calc(var(--u) * 1.6); line-height: 1.5; margin: 0; color: var(--fg-2); }

/* ---------- finale ---------- */
.deck[data-stage="finale"] .titleblock { padding: 0; }
.finale { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; gap: calc(var(--u) * 1.2); }
.lines { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * .5); }
.fline { font-family: var(--display); font-weight: 600; font-size: calc(var(--u) * 2.3); color: var(--fg); opacity: 0; animation: lineup .7s var(--ease) forwards; animation-delay: calc(var(--k) * 900ms + 500ms); }
.fline:nth-child(2) { color: var(--ice); }
.fline:nth-child(3) { color: var(--sky); }
@keyframes lineup { from { opacity: 0; transform: translateY(calc(var(--u) * 1.5)); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
.yes { transform: scale(.6); opacity: 0; }
.yes.go { animation: yes 1s var(--spring) forwards; }
@keyframes yes { to { transform: scale(1); opacity: 1; } }
.yes .bouncy span:not(.sp):not(.word) { color: var(--fg); text-shadow: 0 0 calc(var(--u) * 2) rgba(95, 184, 255, .9), 0 0 calc(var(--u) * 5) rgba(59, 111, 255, .6); }
.yes .bouncy .word:last-child span { color: var(--gold); text-shadow: 0 0 calc(var(--u) * 2) rgba(255, 196, 0, .8), 0 0 calc(var(--u) * 5) rgba(255, 196, 0, .4); }
.yes.go .bouncy span:not(.sp):not(.word) { animation: glowpulse 2.4s ease-in-out infinite; animation-delay: calc(var(--i) * 60ms + 1s); }
@keyframes glowpulse { 50% { filter: brightness(1.25); transform: translateY(-.04em); } }
.fthanks { font-family: var(--display); font-weight: 500; font-size: calc(var(--u) * 1.8); color: var(--fg-2); opacity: 0; animation: fadein .8s both; animation-delay: 4.6s; }
.parade { position: absolute; left: 0; right: 0; bottom: calc(var(--u) * 1.2); display: flex; justify-content: center; align-items: center; gap: calc(var(--u) * .9); pointer-events: none; height: calc(var(--u) * 3); }
.parade i { width: calc(var(--u) * .9); height: calc(var(--u) * .9); border-radius: 50%; background: var(--c); box-shadow: 0 0 calc(var(--u) * .8) var(--c); opacity: .5; animation: lightwave 2.4s ease-in-out infinite; animation-delay: calc(var(--i) * 70ms); }
@keyframes lightwave { 0%, 60%, 100% { transform: none; opacity: .45; } 25% { transform: translateY(calc(var(--u) * -1.1)) scale(1.5); opacity: 1; background: #fff; } }

/* ---------- overlays ---------- */
.slam { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; pointer-events: none; }
.slam span { font-family: var(--display); font-weight: 700; font-size: calc(var(--u) * 8); letter-spacing: -.02em; color: var(--fg); text-shadow: 0 0 calc(var(--u) * 2) rgba(95, 184, 255, .9), 0 0 calc(var(--u) * 6) rgba(59, 111, 255, .7); opacity: 0; }
.slam.go span { animation: slam 1.6s var(--ease) forwards; }
@keyframes slam {
  0% { transform: scale(1.8); opacity: 0; filter: blur(8px); }
  18% { transform: scale(1); opacity: 1; filter: none; }
  70% { transform: scale(1.03); opacity: 1; }
  100% { transform: scale(1.1); opacity: 0; }
}
.reaction { position: fixed; bottom: calc(var(--u) * -6); z-index: 30; pointer-events: none; width: calc(var(--u) * 4.6); height: calc(var(--u) * 4.6); border-radius: 50%; background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .3); box-shadow: 0 0 calc(var(--u) * 1.4) rgba(95, 184, 255, .4); display: grid; place-items: center; font-size: calc(var(--u) * 2.5); animation: risefloat var(--dur, 3.6s) cubic-bezier(.3, .6, .4, 1) forwards; }
@keyframes risefloat {
  0% { transform: translate(0, 0) scale(.4); opacity: 0; }
  12% { opacity: 1; transform: translate(calc(var(--dx) * .2), -8vh) scale(1.1); }
  50% { transform: translate(calc(var(--dx) * -.4), -30vh) scale(1); }
  100% { transform: translate(var(--dx), -62vh) scale(.9); opacity: 0; }
}
.toast { position: fixed; top: calc(var(--u) * 4.2); left: 50%; z-index: 40; transform: translate(-50%, -260%); opacity: 0; background: linear-gradient(90deg, var(--blue), var(--brand-2)); border: 1px solid rgba(255, 255, 255, .3); box-shadow: 0 0 calc(var(--u) * 2) rgba(59, 111, 255, .5); font-family: var(--display); font-weight: 600; font-size: calc(var(--u) * 1.5); padding: calc(var(--u) * .5) calc(var(--u) * 1.6); border-radius: 999px; transition: transform .55s var(--spring), opacity .3s; white-space: nowrap; }
.toast.show { transform: translate(-50%, 0); opacity: 1; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

.controls { position: fixed; left: 50%; bottom: calc(var(--u) * 1.4); transform: translate(-50%, 160%); opacity: 0; z-index: 70; display: flex; align-items: center; gap: 6px; padding: 6px; background: rgba(10, 8, 60, .92); border: 1px solid var(--line); box-shadow: 0 8px 28px rgba(0, 0, 20, .5); border-radius: 999px; transition: transform .35s var(--spring), opacity .25s; font-size: 13px; font-weight: 600; }
.show-controls .controls, .controls:focus-within, .controls:hover { transform: translate(-50%, 0); opacity: 1; }
.controls button { border: 1px solid var(--line); background: var(--glass); border-radius: 999px; padding: 7px 14px; font-weight: 600; white-space: nowrap; }
.controls button:hover { background: var(--glass-2); }
.controls #ctlSim { background: var(--sky); color: var(--bg); border-color: transparent; }
.ctl-label { min-width: 80px; text-align: center; font-family: var(--display); }
.ctl-sep { width: 1px; height: 22px; background: var(--line); margin: 0 2px; }
.status { position: fixed; bottom: calc(var(--u) * 4.4); right: calc(var(--u) * 3); font-size: 12px; font-weight: 600; color: var(--fg-2); z-index: 75; max-width: 60vw; text-align: right; }

/* =====================================================================
   PHONE
   ===================================================================== */
.app { min-height: 100vh; display: flex; flex-direction: column; position: relative; overflow: hidden; background: linear-gradient(165deg, var(--brand) 0%, #0b0770 45%, var(--bg) 100%); }
.app-backdrop { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
.app-backdrop i { position: absolute; width: 120vw; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, var(--c) 0%, transparent 65%); opacity: .35; animation: drift 24s ease-in-out infinite alternate; }
.app-backdrop i:nth-child(1) { --c: #3b6fff; left: -60vw; top: -40vw; }
.app-backdrop i:nth-child(2) { --c: #5fb8ff; right: -70vw; top: 30vh; animation-duration: 29s; opacity: .25; }
.app-backdrop i:nth-child(3) { --c: #2a1fd1; left: -30vw; bottom: -80vw; animation-duration: 21s; }
.app > *:not(.app-backdrop) { position: relative; z-index: 1; }
.app-bar { position: relative; overflow: hidden; background: rgba(5, 4, 40, .55); border-bottom: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.app-bar > * { position: relative; z-index: 1; }
.bar-snow { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.me { display: inline-flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 600; font-size: 15px; color: var(--ice); min-width: 0; }
.me .orb { width: 30px; flex: none; filter: none; }
.me span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-bar .step { font-weight: 600; font-size: 12px; color: var(--fg-2); white-space: nowrap; }
.tbar { height: 5px; background: rgba(255, 255, 255, .1); }
.tbar i { display: block; height: 100%; background: var(--sky); box-shadow: 0 0 8px var(--sky); width: 100%; transform-origin: 0 50%; }
.tbar.hurry i { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.app-main { flex: 1; width: 100%; max-width: 520px; margin: 0 auto; padding: 22px max(16px, env(safe-area-inset-right, 0px)) 130px max(16px, env(safe-area-inset-left, 0px)); }
.in .st { animation: phonein .55s var(--ease) both; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes phonein { from { opacity: 0; transform: translateY(16px); } }
.anon { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; background: var(--glass); border: 1px solid var(--line); color: var(--fg-2); padding: 4px 10px; border-radius: 999px; margin-bottom: 12px; }
.anon svg { width: 13px; height: 13px; }
.q-k { display: inline-block; font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--sky); }
.q-t { font-family: var(--display); font-size: 27px; line-height: 1.15; font-weight: 600; margin: 8px 0 18px; letter-spacing: -.01em; text-wrap: balance; }
.q-ctx { font-size: 14px; font-weight: 500; color: var(--fg-2); margin: -8px 0 18px; line-height: 1.4; }

.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: grid; grid-template-columns: 42px 1fr 26px; gap: 12px; align-items: center; text-align: left; padding: 10px 14px 10px 10px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, .16); background: rgba(255, 255, 255, .07); transition: transform .12s, background .2s, border-color .2s, box-shadow .2s; -webkit-tap-highlight-color: transparent; }
.opt .orb { width: 42px; filter: none; }
.opt .l { font-family: var(--display); font-weight: 600; font-size: 17px; line-height: 1.2; }
.opt .radio { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .4); display: grid; place-items: center; }
.opt:active { transform: scale(.98); }
.opt.sel { background: color-mix(in srgb, var(--c) 28%, transparent); border-color: var(--c); box-shadow: 0 0 0 1px var(--c), 0 0 18px color-mix(in srgb, var(--c) 45%, transparent); }
.opt.sel .orb { animation: flare .6s var(--ease); }
.opt.sel .radio { background: var(--c); border-color: var(--c); animation: chipin .35s var(--spring); }
.opt.sel .radio::after { content: '✓'; color: var(--bg); font-weight: 900; font-size: 15px; line-height: 1; }

.field { margin-top: 20px; }
.field label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 7px; color: var(--fg-2); }
.field input { width: 100%; padding: 13px 14px; font-size: 16px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, .08); color: var(--fg); outline: none; font-family: var(--body); font-weight: 600; }
.field input:focus { border-color: var(--sky); box-shadow: 0 0 0 3px rgba(95, 184, 255, .25); }
.field .note-s { font-size: 12px; font-weight: 500; margin-top: 8px; color: var(--fg-3); }
.err { color: #ff9aa9; font-size: 14px; font-weight: 600; margin: 14px 0 0; }

.cta-wrap { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(180deg, rgba(7, 6, 47, 0), var(--bg) 40%); }
.cta { display: block; width: 100%; max-width: 480px; margin: 0 auto; padding: 16px; font-family: var(--display); font-size: 19px; font-weight: 700; border: 0; border-radius: 14px; background: linear-gradient(90deg, var(--sky), var(--blue)); color: #fff; box-shadow: 0 0 22px rgba(95, 184, 255, .5); transition: transform .1s, opacity .2s; }
.cta:not(:disabled):active { transform: scale(.98); }
.cta:disabled { opacity: .35; box-shadow: none; }

.done { text-align: center; padding-top: 14px; }
.done.in > * { animation: phonein .55s var(--ease) both; }
.done.in > :nth-child(2) { animation-delay: .1s; }
.done.in > :nth-child(3) { animation-delay: .18s; }
.done.in > :nth-child(4) { animation-delay: .26s; }
.done.in > :nth-child(5) { animation-delay: .32s; }
.done.in > :nth-child(6) { animation-delay: .38s; }
.hero { width: 110px; margin: 0 auto 8px; position: relative; }
.hero .orb { width: 100%; animation: orbpulse 2.4s ease-in-out infinite; }
.done h2 { font-family: var(--display); font-weight: 700; font-size: 30px; margin: 6px 0; letter-spacing: -.01em; }
.done p { font-weight: 500; color: var(--fg-2); margin: 0 auto; max-width: 320px; line-height: 1.5; }
.done p b { color: var(--ice); }
.chosen { display: inline-flex; align-items: center; gap: 10px; margin-top: 16px; padding: 8px 16px 8px 8px; background: var(--glass); border: 1px solid var(--line); border-radius: 999px; font-family: var(--display); font-weight: 600; font-size: 15px; }
.chosen .orb { width: 34px; filter: none; }
.link { display: block; margin: 14px auto 0; background: none; border: 0; font-weight: 600; color: var(--ice); text-decoration: underline; text-underline-offset: 3px; }

.react { margin-top: 22px; padding: 16px 14px 18px; background: var(--glass); border: 1px solid var(--line); border-radius: 16px; }
.react-h { font-family: var(--display); font-weight: 600; font-size: 16px; }
.react-s { font-size: 12px; font-weight: 500; color: var(--fg-3); margin-top: 2px; }
.react-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 12px; }
.react-row button { aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 1px solid var(--line); background: rgba(255, 255, 255, .08); font-size: 23px; line-height: 1; display: grid; place-items: center; transition: transform .1s; -webkit-tap-highlight-color: transparent; }
.in .react-row button { animation: chipin .45s var(--spring) both; animation-delay: calc(var(--k) * 60ms + .4s); }
.react-row button:active { transform: scale(.9); }
.react-row button.hit { animation: hit .4s var(--spring); }
@keyframes hit { 40% { transform: scale(1.25); } }
.mini-float { position: fixed; font-size: 28px; pointer-events: none; z-index: 50; animation: minifloat .9s ease-out forwards; }
@keyframes minifloat { to { transform: translateY(-120px) scale(1.3); opacity: 0; } }
.waiting-note { margin-top: 18px; font-size: 13px; font-weight: 600; color: var(--fg-3); display: flex; gap: 8px; justify-content: center; align-items: center; }

<script>
// Shared survey logic, used by the Node server and by the browser-only demo.
// state = { current, revealedQ: { [questionIndex]: true }, timerEnd, hidden: [word],
//           responses: { [questionIndex]: { [anonToken]: { option, word, ts } } } }
// current: a position in the running order (see steps()).
(function (root, factory) {
  const core = factory();
  if (typeof module === 'object' && module.exports) module.exports = core;
  else root.PulseCore = core;
})(typeof self !== 'undefined' ? self : this, function () {
  // Anonymous player names: phones send three small numbers; the name is built from these lists,
  // so nobody can put arbitrary text on the big screen.
  const ADJ = ['Captain', 'Turbo', 'Agent', 'Sir', 'Lady', 'Mighty', 'Jolly', 'Cosmic', 'Speedy', 'Professor', 'Doctor', 'Super', 'Lucky', 'Sparkly', 'Mega', 'Chief'];
  const NOUN = ['Accrual', 'Ledger', 'Spreadsheet', 'Invoice', 'Pivot Table', 'Balance Sheet', 'Audit Trail', 'Forecast', 'Debit', 'Credit', 'VLOOKUP', 'Cash Flow', 'Budget', 'Journal Entry', 'Macro', 'Year-End'];
  const COLORS = 6;
  const int = (v, max) => { const n = Number(v); return Number.isInteger(n) && n >= 0 && n < max ? n : 0; };
  const makePlayer = () => ({ a: (Math.random() * ADJ.length) | 0, n: (Math.random() * NOUN.length) | 0, c: (Math.random() * COLORS) | 0 });
  const cleanPlayer = p => ({ a: int(p && p.a, ADJ.length), n: int(p && p.n, NOUN.length), c: int(p && p.c, COLORS) });
  const playerName = p => `${ADJ[int(p && p.a, ADJ.length)]} ${NOUN[int(p && p.n, NOUN.length)]}`;

  const norm = w => String(w || '').toLowerCase().replace(/\s+/g, ' ').trim();
  const clean = (s, n) => String(s || '').replace(/[<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, n);

  function fill(text, stats) {
    return text.replace(/\{(\w+)\}/g, (_, k) => (stats[k] ?? ''));
  }

  // Headlines are chosen by outcome, so every result is framed constructively.
  function pickTakeaway(q, stats) {
    if (!stats.n) return null;
    const list = q.takeaways || [{ text: q.takeaway || 'Most chosen: “{top}” ({topPct}%)' }];
    const hit = list.find(t =>
      (t.minTopBox == null || (stats.topBox ?? -1) >= t.minTopBox) &&
      (t.minAvg == null || (stats.avg ?? -1) >= t.minAvg)) || list[list.length - 1];
    return fill(hit.text, stats);
  }

  function analyse(q, byToken, hidden) {
    const hide = new Set((hidden || []).map(norm));
    const answers = Object.values(byToken || {});
    const counts = Object.fromEntries(q.options.map(o => [o.id, 0]));
    const words = {};
    let scoreSum = 0, scored = 0, topBoxN = 0;
    for (const a of answers) {
      const opt = q.options.find(o => o.id === a.option);
      if (!opt) continue;
      counts[opt.id]++;
      if (typeof opt.score === 'number') { scoreSum += opt.score; scored++; if (opt.score >= 4) topBoxN++; }
      const w = norm(a.word);
      if (w && !hide.has(w)) words[w] = (words[w] || 0) + 1;
    }
    const n = Object.values(counts).reduce((x, y) => x + y, 0);
    const top = q.options.reduce((best, o) => (counts[o.id] > counts[best.id] ? o : best), q.options[0]);
    const stats = {
      n,
      avg: scored ? +(scoreSum / scored).toFixed(1) : null,
      topBox: scored ? Math.round((100 * topBoxN) / scored) : null,
      top: n ? top.label : null,
      topId: n ? top.id : null,
      topPct: n ? Math.round((100 * counts[top.id]) / n) : 0,
    };
    return { counts, words, stats, takeaway: pickTakeaway(q, stats) };
  }

  function recentWords(byToken, hidden, max = 14) {
    const hide = new Set((hidden || []).map(norm));
    return Object.values(byToken || {})
      .filter(a => a.word && !hide.has(norm(a.word)))
      .sort((a, b) => b.ts - a.ts).slice(0, max).map(a => a.word);
  }

  // The running order. config.show lists every screen of the all-hands (slides, polls, recap, roadmap,
  // finale). Without it: lobby, then each question, then the outro screens.
  // state.current is a position in this list; answers, reveals and clears are keyed by question index (qi).
  const SPECIAL = ['lobby', 'recap', 'roadmap', 'finale'];
  const cache = new WeakMap();
  function steps(config) {
    if (cache.has(config)) return cache.get(config);
    const Q = config.questions;
    const byId = {};
    Q.forEach((q, i) => { byId[q.id || String(i)] = i; });
    const list = Array.isArray(config.show)
      ? config.show.map(st => st.type === 'question' ? { kind: 'question', qi: st.question in byId ? byId[st.question] : Number(st.question), nav: st.nav }
        : SPECIAL.includes(st.type) ? { kind: st.type, nav: st.nav }
        : { kind: 'slide', slide: st, nav: st.nav })
      : [{ kind: 'lobby' }, ...Q.map((q, i) => ({ kind: 'question', qi: i })), ...(config.outro || ['recap', 'roadmap', 'finale']).map(k => ({ kind: k }))];
    const out = list.filter(st => st.kind !== 'question' || Q[st.qi]);
    cache.set(config, out);
    return out;
  }
  const lastIndex = config => steps(config).length - 1;
  const clampIndex = (config, i) => Math.max(0, Math.min(lastIndex(config), Number(i) || 0));
  const stepAt = (config, i) => steps(config)[clampIndex(config, i)];
  const qiAt = (config, i) => { const st = stepAt(config, i); return st && st.kind === 'question' ? st.qi : -1; };
  const navLabel = (config, st) => st.nav || (st.kind === 'question' ? 'Q' + (st.qi + 1)
    : st.kind === 'slide' ? (st.slide.title || st.slide.type) : { lobby: 'Lobby', recap: 'Recap', roadmap: 'Road ahead', finale: 'Finale' }[st.kind]);

  // Timer: entering an unrevealed question starts a countdown (state.timerEnd); revealedQ marks revealed questions.
  const timerMs = (config, q) => 1000 * (q && q.timer != null ? q.timer : (config.timer || 0));
  function enter(config, state, index, now = Date.now()) {
    state.current = clampIndex(config, index);
    const qi = qiAt(config, state.current), q = config.questions[qi];
    const revealed = !!(state.revealedQ || {})[qi];
    state.timerEnd = q && !revealed && timerMs(config, q) ? now + timerMs(config, q) : 0;
  }

  function publicState(config, state, extra = {}) {
    const Q = config.questions, S = steps(config);
    const now = extra.now || Date.now();
    const index = clampIndex(config, state.current);
    const step = S[index], qi = step.kind === 'question' ? step.qi : -1, q = Q[qi];
    const revealed = !q || !!(state.revealedQ || {})[qi];
    const base = {
      team: config.team, event: config.event, holidayDate: config.holidayDate,
      reactions: config.reactions, ticker: config.ticker || [],
      index, qi, total: Q.length, stepCount: S.length, nav: navLabel(config, step),
      revealed,
      timeLeft: q && !revealed && state.timerEnd ? Math.max(0, state.timerEnd - now) : 0,
      timerTotal: timerMs(config, q),
      ...extra,
    };
    delete base.now;
    const participants = new Set(Object.values(state.responses || {}).flatMap(r => Object.keys(r || {}))).size;
    if (step.kind === 'lobby') return { ...base, stage: 'lobby', lobby: config.lobby, participants };
    if (step.kind === 'slide') return { ...base, stage: 'slide', slide: step.slide, participants };
    if (step.kind !== 'question') {
      const items = Q.map((q, i) => ({ title: q.title, options: q.options, pledge: q.pledge, ...analyse(q, state.responses[i], state.hidden) }));
      return { ...base, stage: step.kind, recap: config.recap || {}, roadmap: config.roadmap || {}, finale: config.finale || {}, items, participants };
    }
    return {
      ...base, stage: 'question', question: q,
      ...analyse(q, state.responses[qi], state.hidden),
      recent: recentWords(state.responses[qi], state.hidden),
    };
  }

  return { norm, clean, analyse, publicState, enter, steps, lastIndex, qiAt, navLabel, makePlayer, cleanPlayer, playerName, ADJ, NOUN };
});

</script>

(function (root) {
  const svg = (cls, body) =>
    `<svg class="ico ${cls}" viewBox="0 0 48 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;

      d += `M${cx} ${cy}L${x.toFixed(1)} ${y.toFixed(1)}`;
      const bx = cx + r * .6 * Math.cos(a), by = cy + r * .6 * Math.sin(a);
      for (const s of [-1, 1]) {
        const b = a + s * .7;
        d += `M${bx.toFixed(1)} ${by.toFixed(1)}L${(bx + r * .32 * Math.cos(b)).toFixed(1)} ${(by + r * .32 * Math.sin(b)).toFixed(1)}`;

      }

    }

    if (kind === 'chart') {
      const shapes = {
        rocket: ['M3 28 C 18 27.5, 30 24, 45 4', 45, 4],

        volatile: ['M3 22 L9 10 L15 24 L21 9 L27 21 L33 7 L39 17 L45 5', 45, 5],
        recovery: ['M3 7 L12 15 L19 26 L27 19 L35 12 L45 8', 45, 8],

        `<path class="axis" d="M3 30.5 H45" stroke-width="1.2" opacity=".25"/>` +

        `<path class="bolt" d="M24 9 L19 17 H24 L21 24 L29 14 H24 Z" fill="#ffc400" stroke="#ffffff" stroke-width="1.2"/>`);
    }

    if (kind === 'movie') {
      const bodies = {
        mission: '<path d="M5 27 C 13 27, 13 15, 21 15 S 29 23, 35 13"/><g class="h"><path d="M39 3.5 v3.5 M39 11 v3.5 M33.5 9 h3.5 M41 9 h3.5 M35 5 l2 2 M41 11 l2 2 M43 5 l-2 2 M37 11 l-2 2" stroke-width="2"/></g>',
        heist: '<path d="M14 10 L20 4 H28 L34 10 L24 28 Z"/><path d="M14 10 H34 M20 4 L22 10 L24 28 M28 4 L26 10 L24 28" stroke-width="1.6"/><path class="h" d="M37 4 l1.2 2.4 2.4 1.2 -2.4 1.2 -1.2 2.4 -1.2 -2.4 -2.4 -1.2 2.4 -1.2 z" fill="currentColor" stroke="none"/>',
        quest: '<path d="M4 28 L16 10 L23 19 L30 12 L44 28 Z"/><path class="h" d="M30 12 V3 L37 5.5 L30 8" stroke-width="2"/>',
        race: '<path d="M7 26 A17 17 0 0 1 41 26"/><path d="M11 18 l2.5 1.5 M24 9 v3 M37 18 l-2.5 1.5" stroke-width="1.8"/><path class="h" d="M24 26 L33 14" stroke-width="2.6"/><circle cx="24" cy="26" r="2.4" fill="currentColor" stroke="none"/>',
        toy: '<path d="M24 3 C 30 8, 31 16, 28 23 H20 C 17 16, 18 8, 24 3 Z"/><circle cx="24" cy="12.5" r="2.6"/><path d="M20 18 L15 25 L20 23 M28 18 L33 25 L28 23" stroke-width="2"/><path class="h" d="M21.5 25.5 L24 31 L26.5 25.5" stroke-width="2"/>',

        snow: `<path class="h" d="${snowflake(24, 16, 13)}" stroke-width="2.2"/>`,

  }

  // Light orbs: a glowing point of light in the lane colour (no faces).
  // orb(color) is plain; orbIcon(color, spec) puts a line icon inside; orbText(color, text) shows initials.
  function orb(color, inner = '') {
    return `<svg class="orb" viewBox="0 0 64 64" aria-hidden="true">
      <circle class="halo" cx="32" cy="32" r="30" fill="${color}" opacity=".16"/>
      <circle class="glow" cx="32" cy="32" r="23" fill="${color}" opacity=".3"/>

      <circle cx="32" cy="32" r="17" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.5"/>

    </svg>`;
  }
  const orbIcon = (color, spec) => orb(color, `<g style="color:#fff">${icon(spec).replace('<svg ', '<svg x="18" y="22.5" width="28" height="19" ')}</g>`);
  const orbText = (color, text) => orb(color, `<text x="32" y="37.5" text-anchor="middle" font-family="Space Grotesk, Inter, sans-serif" font-weight="700" font-size="15" fill="#fff">${String(text).replace(/[<>&]/g, '')}</text>`);

    function paintQuestion(s, meta) {
      const q = s.question, n = s.stats.n;

      $('race').classList.toggle('racing', !s.revealed);
      $('joinCard').classList.toggle('call', n < 3);

        b.innerHTML = s.revealed && s.takeaway ? emphasise(s.takeaway) : n ? 'Votes are pouring in… who will win the race?' : 'Grab your phone, scan the code, pick your answer!';
        if (s.revealed && s.takeaway) FX.splitWords(b, 45);

        FX.tween(lane.querySelector('.pct'), pct, v => Math.round(v) + '%');

      });

        else $('k-avg').textContent = '?';
      } else {
        const opt = q.options.find(o => o.id === s.stats.topId), i = q.options.indexOf(opt);
        const html = s.revealed && opt ? `${orbIcon(LANES[i % LANES.length], opt.icon)}<b>${esc(opt.label)}</b>` : '<span class="q">?</span>';
        if ($('leader').dataset.k !== html) { $('leader').dataset.k = html; $('leader').innerHTML = html; }
      }
      if (meta.pop) hop(meta.pop);
      scheduleCloud(s);

      // live words, with a light-hearted ticker line after every few words (or only jokes until words arrive)
      const jokes = s.ticker || [], words = s.recent || [];
      const parts = [];
      words.forEach((w, k) => { parts.push(`<span>${esc(w)}</span>`); if (k % 4 === 3 && jokes.length) parts.push(`<span class="joke">${esc(jokes[(s.index + k) % jokes.length])}</span>`); });
      if (!words.length) jokes.forEach(j => parts.push(`<span class="joke">${esc(j)}</span>`));
      const tick = parts.join('');

      $('source').textContent = words.length ? 'Live feed' : 'Finance news';

      if (!s.revealed && s.timeLeft > 0) startTimer(s.timeLeft, s.timerTotal);
      else stopTimer(!s.revealed && s.timerTotal > 0);
      if (revealedPrev === false && s.revealed) revealMoment(timesUp ? "TIME'S UP!" : 'REVEAL!');
      revealedPrev = s.revealed;

      if (lastN !== null && n > lastN) {
        const hit = [10, 25, 50, 75, 100, 150, 200, 250, 300, 400, 500].find(m => lastN < m && n >= m);
        if (hit) { FX.toast($('toast'), `🎉 ${hit} votes and counting!`); confetti.burst('top'); }
      }
      lastN = n;
    }

    function hop(id) {
      const lane = document.querySelector(`.lane[data-id="${CSS.escape(id)}"]`);
      if (!lane) return;
      const r = lane.querySelector('.runner');
      r.classList.remove('hop'); void r.offsetWidth; r.classList.add('hop');
      const p = document.createElement('div'); p.className = 'plus'; p.textContent = '+1';
      r.appendChild(p); setTimeout(() => p.remove(), 1000);
    }

    // ---------- countdown ----------
    let deadline = 0, total = 0, timerOn = false, autoSent = false, timesUp = false, lastSec = null;
    function startTimer(left, tot) {
      deadline = performance.now() + left; total = tot || left;
      const t = $('timer');
      t.hidden = false; t.classList.remove('done');
      if (!timerOn) { timerOn = true; autoSent = false; timesUp = false; requestAnimationFrame(tickTimer); }
    }
    function stopTimer(showZero) {
      timerOn = false;
      const t = $('timer');

      if (showZero) { t.hidden = false; $('tnum').textContent = '0'; $('tfg').style.strokeDashoffset = 100; t.classList.add('done'); }
      else t.hidden = true;
    }
    function tickTimer() {
      if (!timerOn || !$('timer')) return;
      const rem = Math.max(0, deadline - performance.now());
      const sec = Math.ceil(rem / 1000);
      if (sec !== lastSec) { lastSec = sec; const b = $('tnum'); b.textContent = sec; b.classList.remove('tick'); void b.offsetWidth; b.classList.add('tick'); }
      $('tfg').style.strokeDashoffset = (100 * (1 - rem / total)).toFixed(2);
      $('timer').classList.toggle('hurry', rem < 5500 && rem > 0);
      if (rem <= 0) {
        timerOn = false; timesUp = true;
        $('timer').classList.remove('hurry'); $('timer').classList.add('done');
        if (T.canControl && !autoSent) { autoSent = true; T.act('reveal'); }
        else if (!T.canControl) slam("TIME'S UP!");
        return;
      }
      requestAnimationFrame(tickTimer);
    }

    function slam(text) {
      const el = $('slam');
      el.firstChild.textContent = text;
      el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
    }
