<script>
// Shared survey logic, used by the Node server and by the browser-only demo.
// state = { current, revealedQ: { [questionIndex]: true }, timerEnd, hidden: [word],
//           responses: { [questionIndex]: { [anonToken]: { option, word, ts } } } }
// current: a position in the running order (see steps()).
(function (root, factory) {
  const core = factory();
  if (typeof module === 'object' && module.exports) module.exports = core;
  else root.PulseCore = core;
})(typeof self !== 'undefined' ? self : this, function () {
  // Anonymous player names: phones send three small numbers; the name is built from these lists,
  // so nobody can put arbitrary text on the big screen.
  const ADJ = ['Captain', 'Turbo', 'Agent', 'Sir', 'Lady', 'Mighty', 'Jolly', 'Cosmic', 'Speedy', 'Professor', 'Doctor', 'Super', 'Lucky', 'Sparkly', 'Mega', 'Chief'];
  const NOUN = ['Accrual', 'Ledger', 'Spreadsheet', 'Invoice', 'Pivot Table', 'Balance Sheet', 'Audit Trail', 'Forecast', 'Debit', 'Credit', 'VLOOKUP', 'Cash Flow', 'Budget', 'Journal Entry', 'Macro', 'Year-End'];
  const COLORS = 6;
  const int = (v, max) => { const n = Number(v); return Number.isInteger(n) && n >= 0 && n < max ? n : 0; };
  const makePlayer = () => ({ a: (Math.random() * ADJ.length) | 0, n: (Math.random() * NOUN.length) | 0, c: (Math.random() * COLORS) | 0 });
  const cleanPlayer = p => ({ a: int(p && p.a, ADJ.length), n: int(p && p.n, NOUN.length), c: int(p && p.c, COLORS) });
  const playerName = p => `${ADJ[int(p && p.a, ADJ.length)]} ${NOUN[int(p && p.n, NOUN.length)]}`;

  const norm = w => String(w || '').toLowerCase().replace(/\s+/g, ' ').trim();
  const clean = (s, n) => String(s || '').replace(/[<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, n);

  function fill(text, stats) {
    return text.replace(/\{(\w+)\}/g, (_, k) => (stats[k] ?? ''));
  }

  // Headlines are chosen by outcome, so every result is framed constructively.
  function pickTakeaway(q, stats) {
    if (!stats.n) return null;
    const list = q.takeaways || [{ text: q.takeaway || 'Most chosen: “{top}” ({topPct}%)' }];
    const hit = list.find(t =>
      (t.minTopBox == null || (stats.topBox ?? -1) >= t.minTopBox) &&
      (t.minAvg == null || (stats.avg ?? -1) >= t.minAvg)) || list[list.length - 1];
    return fill(hit.text, stats);
  }

  function analyse(q, byToken, hidden) {
    const hide = new Set((hidden || []).map(norm));
    const answers = Object.values(byToken || {});
    const counts = Object.fromEntries(q.options.map(o => [o.id, 0]));
    const words = {};
    let scoreSum = 0, scored = 0, topBoxN = 0;
    for (const a of answers) {
      const opt = q.options.find(o => o.id === a.option);
      if (!opt) continue;
      counts[opt.id]++;
      if (typeof opt.score === 'number') { scoreSum += opt.score; scored++; if (opt.score >= 4) topBoxN++; }
      const w = norm(a.word);
      if (w && !hide.has(w)) words[w] = (words[w] || 0) + 1;
    }
    const n = Object.values(counts).reduce((x, y) => x + y, 0);
    const top = q.options.reduce((best, o) => (counts[o.id] > counts[best.id] ? o : best), q.options[0]);
    const stats = {
      n,
      avg: scored ? +(scoreSum / scored).toFixed(1) : null,
      topBox: scored ? Math.round((100 * topBoxN) / scored) : null,
      top: n ? top.label : null,
      topId: n ? top.id : null,
      topPct: n ? Math.round((100 * counts[top.id]) / n) : 0,
    };
    return { counts, words, stats, takeaway: pickTakeaway(q, stats) };
  }

  function recentWords(byToken, hidden, max = 14) {
    const hide = new Set((hidden || []).map(norm));
    return Object.values(byToken || {})
      .filter(a => a.word && !hide.has(norm(a.word)))
      .sort((a, b) => b.ts - a.ts).slice(0, max).map(a => a.word);
  }

  // The running order. config.show lists every screen of the all-hands (slides, polls, recap, roadmap,
  // finale). Without it: lobby, then each question, then the outro screens.
  // state.current is a position in this list; answers, reveals and clears are keyed by question index (qi).
  const SPECIAL = ['lobby', 'recap', 'roadmap', 'finale'];
  const cache = new WeakMap();
  function steps(config) {
    if (cache.has(config)) return cache.get(config);
    const Q = config.questions;
    const byId = {};
    Q.forEach((q, i) => { byId[q.id || String(i)] = i; });
    const list = Array.isArray(config.show)
      ? config.show.map(st => ({
        ...(st.type === 'question' ? { kind: 'question', qi: st.question in byId ? byId[st.question] : Number(st.question) }
          : SPECIAL.includes(st.type) ? { kind: st.type }
          : { kind: 'slide', slide: st }),
        nav: st.nav, notes: st.notes || '', extra: !!st.extra,
      }))
      : [{ kind: 'lobby' }, ...Q.map((q, i) => ({ kind: 'question', qi: i })), ...(config.outro || ['recap', 'roadmap', 'finale']).map(k => ({ kind: k }))];
    const out = list.filter(st => st.kind !== 'question' || Q[st.qi]);
    // Chapters for the bar at the top: the opening is "Welcome", every section starts a chapter (its short
    // nav label without the number), the recap starts "Wrap-up". Any step can start one with "chapter".
    // The extra check-in steps are not part of the chapter bar.
    const names = [];
    out.forEach((st, i) => {
      if (st.extra) { st.chapter = -1; return; }
      const own = st.kind === 'slide' ? st.slide.chapter : (config.show || [])[i] && config.show[i].chapter;
      const name = own || (i === 0 ? 'Welcome'
        : st.kind === 'slide' && st.slide.type === 'section' ? String(st.nav || st.slide.title || '').replace(/^\s*\d+\s*/, '') || st.slide.title
        : st.kind === 'recap' && !names.includes('Wrap-up') ? 'Wrap-up' : '');
      if (name) names.push(name);
      st.chapter = Math.max(0, names.length - 1);
    });
    out.chapters = names;
    cache.set(config, out);
    return out;
  }
  const lastIndex = config => steps(config).length - 1;
  // Next and previous stay inside their part of the show: the main all-hands, or the extra check-in steps
  // (which the presenter opens with "goto"), so "next" after the finale never runs into the check-in.
  function nextIndex(config, i) {
    const S = steps(config), cur = clampIndex(config, i);
    return cur + 1 < S.length && !!S[cur + 1].extra === !!S[cur].extra ? cur + 1 : cur;
  }
  function prevIndex(config, i) {
    const S = steps(config), cur = clampIndex(config, i);
    return cur > 0 && !!S[cur - 1].extra === !!S[cur].extra ? cur - 1 : cur;
  }
  const firstExtra = config => steps(config).findIndex(st => st.extra);
  // Questions are numbered within their group: the all-hands polls, the award, the check-in.
  const groupOf = q => (q.type === 'award' ? 'award' : q.group || 'main');
  function numbering(config, qi) {
    const Q = config.questions, g = groupOf(Q[qi]);
    const same = Q.map((q, i) => [q, i]).filter(([q]) => groupOf(q) === g).map(([, i]) => i);
    return { group: g, qn: same.indexOf(qi) + 1, qtotal: same.length };
  }

  // Anonymous Q&A: each phone keeps its own questions and upvotes in responses.ask[token] = { q: [{ id, text, ts }], up: [id] }.
  function qaList(byToken, qa) {
    const done = new Set((qa && qa.done) || []), hide = new Set((qa && qa.hidden) || []);
    const list = new Map();
    for (const a of Object.values(byToken || {})) for (const x of (a && a.q) || []) {
      if (x && x.id && x.text && !hide.has(x.id) && !list.has(x.id)) list.set(x.id, { id: String(x.id).slice(0, 24), text: clean(x.text, 140), ts: Number(x.ts) || 0, votes: 0, done: done.has(x.id) });
    }
    for (const a of Object.values(byToken || {})) for (const id of new Set((a && a.up) || [])) if (list.has(id)) list.get(id).votes++;
    return [...list.values()].sort((p, q) => (p.done - q.done) || (q.votes - p.votes) || (p.ts - q.ts));
  }

  // Tug of war: every phone is on team 0 or 1, decided by its anonymous token (about half and half).
  // responses.tug[token] = { id: round id, team, taps }. state.tug = { id, phase: countdown|go|done, at, goAt, final }.
  const teamOf = t => { let h = 7; for (const ch of String(t || '')) h = (h * 31 + ch.charCodeAt(0)) | 0; return Math.abs(h) % 2; };
  function tugState(byToken, tug) {
    const t = tug || { phase: 'ready' };
    const players = [0, 0], taps = [0, 0];
    for (const a of Object.values(byToken || {})) {
      if (!a) continue;
      const team = a.team === 1 ? 1 : 0;
      players[team]++;
      if (t.id && a.id === t.id) taps[team] += Math.max(0, Math.min(400, Number(a.taps) || 0));
    }
    return { ...t, players, taps: Array.isArray(t.final) ? t.final : taps };
  }

  // Kudos wall: responses.kudos[token] = { list: [{ id, to, text, kind, ts }] }; the presenter can hide cards.
  function kudosList(byToken, hidden) {
    const hide = new Set(hidden || []), out = [];
    for (const a of Object.values(byToken || {})) for (const k of (a && a.list) || []) {
      if (k && k.id && k.text && !hide.has(k.id)) out.push({ id: String(k.id).slice(0, 24), to: clean(k.to, 40), text: clean(k.text, 140), kind: clean(k.kind, 12), ts: Number(k.ts) || 0 });
    }
    return out.sort((p, q) => q.ts - p.ts);
  }

  // Everything worth keeping after the event, for the downloadable summary.
  function summary(config, state) {
    const Q = config.questions;
    return {
      team: config.team, event: config.event, at: Date.now(),
      participants: new Set(Object.entries(state.responses || {}).filter(([k]) => k !== 'ask').flatMap(([, r]) => Object.keys(r || {}))).size,
      questions: Q.map((q, i) => ({ id: q.id, title: q.title, type: q.type || 'poll', group: groupOf(q), pledge: q.pledge, options: q.options, ...analyse(q, (state.responses || {})[i], state.hidden) })),
      qa: qaList((state.responses || {}).ask, state.qa),
      kudos: kudosList((state.responses || {}).kudos, state.kudosHidden),
      tug: state.tug && state.tug.final ? { teams: ((config.show || []).find(st => st.type === 'tug') || {}).teams || ['Debit', 'Credit'], final: state.tug.final } : null,
    };
  }
  const clampIndex = (config, i) => Math.max(0, Math.min(lastIndex(config), Number(i) || 0));
  const stepAt = (config, i) => steps(config)[clampIndex(config, i)];
  const qiAt = (config, i) => { const st = stepAt(config, i); return st && st.kind === 'question' ? st.qi : -1; };
  const navLabel = (config, st) => st.nav || (st.kind === 'question' ? 'Q' + (st.qi + 1)
    : st.kind === 'slide' ? (st.slide.title || st.slide.type) : { lobby: 'Lobby', recap: 'Recap', roadmap: 'Road ahead', finale: 'Finale' }[st.kind]);

  // Timer: entering an unrevealed question starts a countdown (state.timerEnd); revealedQ marks revealed questions.
  const timerMs = (config, q) => 1000 * (q && q.timer != null ? q.timer : (config.timer || 0));
  function enter(config, state, index, now = Date.now()) {
    state.current = clampIndex(config, index);
    const qi = qiAt(config, state.current), q = config.questions[qi];
    const revealed = !!(state.revealedQ || {})[qi];
    state.timerEnd = q && !revealed && timerMs(config, q) ? now + timerMs(config, q) : 0;
  }

  function publicState(config, state, extra = {}) {
    const Q = config.questions, S = steps(config);
    const now = extra.now || Date.now();
    const index = clampIndex(config, state.current);
    const step = S[index], qi = step.kind === 'question' ? step.qi : -1, q = Q[qi];
    const revealed = !q || !!(state.revealedQ || {})[qi];
    const nextI = nextIndex(config, index), nextStep = nextI !== index ? S[nextI] : null;
    const num = q ? numbering(config, qi) : { group: '', qn: 0, qtotal: 0 };
    const base = {
      team: config.team, event: config.event, holidayDate: config.holidayDate, countdown: config.countdown,
      reactions: config.reactions, ticker: config.ticker || [],
      index, qi, total: Q.filter(x => groupOf(x) === 'main').length, stepCount: S.length, nav: navLabel(config, step),
      qn: num.qn, qtotal: num.qtotal, group: num.group, extra: step.extra,
      notes: step.notes || '', next: nextStep ? navLabel(config, nextStep) : '',
      chapters: S.chapters || [], chapter: step.chapter ?? -1,
      revealed,
      timeLeft: q && !revealed && state.timerEnd ? Math.max(0, state.timerEnd - now) : 0,
      timerTotal: timerMs(config, q),
      ...extra,
    };
    delete base.now;
    const participants = new Set(Object.values(state.responses || {}).flatMap(r => Object.keys(r || {}))).size;
    if (step.kind === 'lobby') return { ...base, stage: 'lobby', lobby: config.lobby, participants };
    if (step.kind === 'slide') {
      // a "nominees" slide shows the candidates of the award vote it names
      const aw = step.slide.type === 'nominees' ? Q.find(x => x.id === step.slide.question) || Q.find(x => x.type === 'award') : null;
      const type = step.slide.type;
      const qa = type === 'qa' ? qaList((state.responses || {}).ask, state.qa) : undefined;
      const tug = type === 'tug' ? tugState((state.responses || {}).tug, state.tug) : undefined;
      const kudos = type === 'kudos' ? kudosList((state.responses || {}).kudos, state.kudosHidden) : undefined;
      return { ...base, stage: 'slide', slide: step.slide, nominees: aw ? aw.options : undefined, qa, tug, kudos, participants };
    }
    if (step.kind !== 'question') {
      const items = Q.map((q, i) => groupOf(q) !== 'main' ? null : ({ title: q.title, options: q.options, pledge: q.pledge, ...analyse(q, state.responses[i], state.hidden) })).filter(Boolean);
      return { ...base, stage: step.kind, recap: config.recap || {}, roadmap: config.roadmap || {}, finale: config.finale || {}, items, participants };
    }
    const ci = q.compareWith ? Q.findIndex(x => x.id === q.compareWith) : -1;
    return {
      ...base, stage: 'question', question: q,
      ...analyse(q, state.responses[qi], state.hidden),
      recent: recentWords(state.responses[qi], state.hidden),
      compare: ci >= 0 ? { label: q.compareLabel || 'Before', ...analyse(Q[ci], state.responses[ci], state.hidden).stats } : null,
    };
  }

  return { norm, clean, analyse, publicState, enter, steps, lastIndex, nextIndex, prevIndex, firstExtra, qiAt, navLabel, numbering, qaList, summary, teamOf, tugState, kudosList, makePlayer, cleanPlayer, playerName, ADJ, NOUN };
});

        const h = 6 + i * 5.5, x = 3 + i * 8.5;

        rocket: ['M3 28 C 18 27.5, 30 24, 45 4', 45, 4],
        bull: ['M3 26 L11 21 L18 23 L26 15 L33 16 L45 6', 45, 6],
        volatile: ['M3 22 L9 10 L15 24 L21 9 L27 21 L33 7 L39 17 L45 5', 45, 5],
        recovery: ['M3 7 L12 15 L19 26 L27 19 L35 12 L45 8', 45, 8],
        sideways: ['M3 17 L10 13 L17 19 L24 14 L31 18 L38 14 L45 16', 45, 16],
      };
      const [d, ex, ey] = shapes[arg] || shapes.bull;
      return svg('i-chart',
        `<path class="axis" d="M3 30.5 H45" stroke-width="1.2" opacity=".25"/>` +
        `<path class="ln" pathLength="1" d="${d}"/>` +
        `<circle class="dot" cx="${ex}" cy="${ey}" r="2.6" fill="currentColor" stroke="none"/>`);
    }

    if (kind === 'battery') {
      const pct = Math.max(0, Math.min(100, Number(arg) || 0));
      const w = Math.max(2, (pct / 100) * 30);

        team: '<circle cx="18" cy="10" r="4.5"/><path d="M8 29 c0-6.5 4.5-10 10-10 s10 3.5 10 10"/><circle class="h" cx="32" cy="11" r="4"/><path class="h" d="M28 20.5 c1.2-.6 2.6-.9 4-.9 c5 0 8.5 3.2 8.5 9.4"/>',
        trophy: '<path d="M16 4 h16 v7 a8 8 0 0 1 -16 0 z"/><path d="M16 7 h-4.5 a4.5 4.5 0 0 0 5 6.5 M32 7 h4.5 a4.5 4.5 0 0 1 -5 6.5 M24 19 v5 M18 28.5 h12 M20 24.5 h8"/><path class="h" d="M24 7.5 l1.2 2.4 2.6.4 -1.9 1.8 .5 2.6 -2.4-1.3 -2.4 1.3 .5-2.6 -1.9-1.8 2.6-.4z" fill="currentColor" stroke="none"/>',

        heart: '<path d="M24 30 C 14 23, 8 18, 8 11.5 A 6.5 6.5 0 0 1 24 8 A 6.5 6.5 0 0 1 40 11.5 C 40 18, 34 23, 24 30 Z"/><path class="h" d="M15 11.5 a3 3 0 0 1 3-3"/>',
        boost: '<path d="M27 3 L12 19 h10 l-4 11 L36 13 h-10 z"/><path class="h" d="M8 8 l3 2 M40 22 l-3-2" />',

  // Light orbs: a glowing point of light in the lane colour (no faces).

  function orb(color, inner = '') {
    return `<svg class="orb" viewBox="0 0 64 64" aria-hidden="true">

  const orbText = (color, text) => orb(color, `<text x="32" y="37.5" text-anchor="middle" font-family="Space Grotesk, Inter, sans-serif" font-weight="700" font-size="15" fill="#fff">${String(text).replace(/[<>&]/g, '')}</text>`);

<script>
// Shared motion + effects: count-ups, word reveals, confetti, snowfall, the live pulse line, reactions.
(function (root) {
  const reduce = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const raf = cb => requestAnimationFrame(cb);

  function tween(el, to, fmt = v => Math.round(v), d = 750) {
    if (!el) return;
    const from = Number(el.dataset.v || 0); el.dataset.v = to;
    if (from === to || reduce) { el.textContent = fmt(to); return; }
    const t0 = performance.now();
    const step = t => {
      const k = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmt(from + (to - from) * e);
      if (k < 1) raf(step);
    };
    raf(step);
  }

  // Wrap each word of an element's text in a span so CSS can reveal them one by one.
  function splitWords(el, step = 55) {
    let i = 0;
    const walk = node => {
      for (const child of [...node.childNodes]) {
        if (child.nodeType === 3) {
          const frag = document.createDocumentFragment();
          child.textContent.split(/(\s+)/).forEach(part => {
            if (!part) return;
            if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); return; }
            const s = document.createElement('span');
            s.className = 'wd'; s.style.setProperty('--w', i++); s.style.setProperty('--step', step + 'ms');
            s.textContent = part; frag.appendChild(s);

  function fitCanvas(c) {
    const r = c.getBoundingClientRect(), dpr = devicePixelRatio || 1;
    c.width = Math.max(1, r.width * dpr); c.height = Math.max(1, r.height * dpr);

  function Confetti(canvas) {

        for (let i = 0; i < count; i++) {
          const a = angle + (Math.random() - .5) * spread, v = speed * (.55 + Math.random() * .6);
          parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * 6, vr: (Math.random() - .5) * .3,
            w: 6 + Math.random() * 8, h: 4 + Math.random() * 6, c: COLORS[(Math.random() * COLORS.length) | 0], life: 0 });
        }
      };

    resize(); addEventListener('resize', resize);
    const beat = k => queue.push(...[.12, .3, -.18, 1, -.6, .28, .08, 0].map(v => v * k));
    this.spike = (k = 1) => { if (queue.length < 40) beat(Math.min(1, k)); };
    let acc = 0, prev = performance.now();
    const loop = t => {
      if (!canvas.isConnected) return;
      acc += t - prev; prev = t;

        acc -= 16;

        if (queue.length) lastBeat = t;

    const burst = r => {
      const n = 60 + (Math.random() * 40) | 0, sp = H * (.004 + Math.random() * .003);
      for (let i = 0; i < n; i++) { const a = (i / n) * 6.283, v = sp * (.6 + Math.random() * .6); sparks.push({ x: r.x, y: r.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, c: Math.random() < .25 ? '#ffffff' : r.c }); }

      if (!on || !canvas.isConnected) { ctx.clearRect(0, 0, W, H); return; }
      if (t - last > 650) { launch(); if (Math.random() < .5) launch(); last = t; }
      ctx.clearRect(0, 0, W, H);
      rockets = rockets.filter(r => {
        r.y += r.vy; r.vy *= .985;
        ctx.fillStyle = r.c; ctx.beginPath(); ctx.arc(r.x, r.y, 3, 0, 6.283); ctx.fill();
        if (r.y <= r.tx || r.vy > -1) { burst(r); return false; }

        p.x += p.vx; p.y += p.vy; p.vy += .05; p.vx *= .985; p.life -= .012;
        ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.c;

  }

    const dur = 3.2 + Math.random() * 1.4;

<script>
// Private content for the public website: the presentation itself is not in the pages.
// - The presenter screen (and the simulator) ask for the presenter key once, then load the full content
//   from Supabase (rpc pulse_get_content). A ?key=… in the address is taken and removed from the address bar.
// - Phones load only the poll questions, with the join code that the QR code on the big screen carries
//   (#j=…, rpc pulse_get_phone). Without it they are asked to scan the code.
(function (root) {
  const KEY = 'pulse-key', JOIN = 'pulse-join';
  const store = {
    get(k) { try { return sessionStorage.getItem(k) || localStorage.getItem(k); } catch { return null; } },
    set(k, v, remember) { try { sessionStorage.setItem(k, v); if (remember) localStorage.setItem(k, v); } catch {} },
    del(k) { try { sessionStorage.removeItem(k); localStorage.removeItem(k); } catch {} },
  };
  async function rpc(url, anon, fn, args) {
    let r;
    try {
      r = await fetch(`${url}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { apikey: anon, Authorization: 'Bearer ' + anon, 'Content-Type': 'application/json' }, body: JSON.stringify(args) });
    } catch { const e = new Error('offline'); e.offline = true; throw e; }
    const body = await r.json().catch(() => null);
    if (!r.ok) { const e = new Error((body && body.message) || 'error ' + r.status); e.denied = !!(body && body.code === '42501'); throw e; }
    if (!body || typeof body !== 'object' || !body.config) { const e = new Error('No content has been uploaded yet'); e.empty = true; throw e; }
    return body;
  }
  const LOCK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  const STYLE = `<style>
    .lk { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(900px 600px at 15% -10%, #1b129e, transparent 60%), #07062f; color: #fff; font: 16px/1.5 Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .lk-card { width: min(440px, 100%); background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.16); border-radius: 20px; padding: 28px; box-shadow: 0 30px 80px rgba(0,0,20,.5); }
    .lk-ico { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: rgba(95,184,255,.16); color: #5fb8ff; margin-bottom: 14px; }
    .lk-ico svg { width: 26px; height: 26px; }
    .lk h1 { margin: 0 0 6px; font: 700 24px 'Space Grotesk', Inter, sans-serif; }
    .lk p { margin: 0 0 16px; color: rgba(255,255,255,.75); }
    .lk label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
    .lk input[type=password] { width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.25); color: #fff; font: 16px Inter, sans-serif; }
    .lk input[type=password]:focus { outline: 2px solid #5fb8ff; outline-offset: 1px; }
    .lk-check { display: flex; align-items: center; gap: 8px; margin: 12px 0 18px; font-size: 14px; color: rgba(255,255,255,.8); }
    .lk-check input { width: 18px; height: 18px; accent-color: #5fb8ff; }
    .lk button { width: 100%; padding: 13px; border: 0; border-radius: 12px; background: #3b6fff; color: #fff; font: 700 16px 'Space Grotesk', Inter, sans-serif; cursor: pointer; }
    .lk button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .lk button:disabled { opacity: .6; }
    .lk-err { min-height: 1.5em; margin: 10px 0 0; color: #ffc400; font-size: 14px; }
    .lk-foot { margin: 16px 0 0; font-size: 13px; color: rgba(255,255,255,.55); }
  </style>`;

  // Presenter: resolves with { key, data } once the right key is in.
  function presenter({ url, anon, el, what = 'presenter screen' }) {
    const params = new URLSearchParams(location.search);

      params.delete('key');
      history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params : '') + location.hash);
    }
    const saved = fromUrl || store.get(KEY);
    return new Promise(resolve => {
      const tryKey = async (key, remember, quiet) => {
        try {
          const data = await rpc(url, anon, 'pulse_get_content', { p_key: key });
          store.set(KEY, key, remember);
          resolve({ key, data });

          if (e.denied) store.del(KEY);
          if (!quiet || !e.denied) show(e.denied ? 'That key is not right. Try again.' : e.empty ? 'No content has been uploaded yet.' : 'Could not reach the server. Check the connection and try again.');
          else show('');

      function show(msg) {
        if (!el.querySelector('.lk')) {
          el.innerHTML = STYLE + `<main class="lk"><form class="lk-card" id="lkForm" autocomplete="off">
            <div class="lk-ico">${LOCK_SVG}</div>
            <h1>Private presentation</h1>
            <p>Enter the presenter key to open the ${what}. You only need to do this once on this computer.</p>
            <label for="lkKey">Presenter key</label>
            <input type="password" id="lkKey" autocomplete="current-password" spellcheck="false">
            <label class="lk-check"><input type="checkbox" id="lkRemember" checked> Remember on this computer</label>
            <button id="lkGo">Open</button>

            e.preventDefault();

            if (!k) return;
            el.querySelector('#lkGo').disabled = true;
            await tryKey(k, el.querySelector('#lkRemember').checked, false);
            const go = el.querySelector('#lkGo'); if (go) go.disabled = false;
          };
        }
        const err = el.querySelector('#lkErr'); if (err) err.textContent = msg;
        const inp = el.querySelector('#lkKey'); if (inp) inp.focus();
      }
      if (saved) tryKey(saved, true, true); else show('');
    });
  }

  // Phone: resolves with the poll content once the join code from the QR code works.
  function phone({ url, anon, el }) {
    const m = location.hash.match(/[#&]j=([A-Za-z0-9_-]{6,64})/);
    if (m) { store.set(JOIN, m[1], true); history.replaceState(null, '', location.pathname + location.search); }
    const code = (m && m[1]) || store.get(JOIN);
    const scan = msg => {
      addEventListener('hashchange', () => { if (/[#&]j=/.test(location.hash)) location.reload(); });
      el.innerHTML = STYLE + `<main class="lk"><div class="lk-card"><div class="lk-ico">${LOCK_SVG}</div>
        <h1>Scan to join</h1><p>${msg}</p><p class="lk-foot">The QR code is on the big screen in the room.</p></div></main>`;
    };
    return new Promise(resolve => {
      if (!code) return scan('Scan the QR code on the big screen with your phone camera to join.');
      rpc(url, anon, 'pulse_get_phone', { p_code: code }).then(resolve).catch(e => {
        if (e.denied) { store.del(JOIN); scan('This link has expired. Scan the QR code on the big screen again.'); }
        else scan('Could not reach the server. Check your connection, then reload this page.');
      });
    });
  }

  const forget = () => { store.del(KEY); location.reload(); };
  root.PulseLock = { presenter, phone, forget };
})(typeof self !== 'undefined' ? self : this);

<script>
// Presenter guide and tools, opened with the "Guide" button or the ? key on the presenter screen:
// how to go full screen, the keys and buttons, a before-you-start checklist, the presenter view,
// the results download, the February check-in, and a check for placeholders still left in the content.
(function (root) {
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------- full screen ----------

    if (!config) return null;

      } else if (Array.isArray(v)) v.forEach(x => scan(where, x));
      else if (v && typeof v === 'object') for (const [k, x] of Object.entries(v)) if (k !== 'demo' && k !== 'notes') scan(where, x);
    };
    (config.show || []).forEach((st, i) => { if (st.type !== 'question') scan(`${i + 1} · ${st.nav || st.title || st.type}`, st); });
    (config.questions || []).forEach(q => scan(q.type === 'award' ? 'Award vote' : `Question “${q.title}”`, q));
    scan('Timeline', config.roadmap && { rows: config.roadmap.rows, holidays: config.roadmap.holidays });

  // ---------- results summary (a standalone page to save or print) ----------

                <li>Click a word in the word cloud to remove it.</li>
                <li>Q&amp;A: click a question once to mark it answered, again to hide it.</li>
                <li>Kudos wall: click a card to remove it.</li>
              </ul>
            </section>
            <section>
              <h3>Tools</h3>
              <div class="help-tools">
                <button data-h="full">Full screen</button>
                ${T.notesUrl ? '<button data-h="notes">Open presenter view</button>' : ''}
                ${T.summary ? '<button data-h="export">Download results</button>' : ''}
                ${T.config && PulseCore.firstExtra(T.config) >= 0 ? `<button data-h="checkin">${inCheckin ? 'Back to the all-hands' : 'Go to the February check-in'}</button>` : ''}
                ${T.lock ? '<button data-h="lock">Lock this screen</button>' : ''}
              </div>
              <p class="help-note">The February check-in uses the same QR code. It sits after the finale, so <i>Next</i> never runs into it by accident.</p>
              <h3>Content check</h3>
              ${list == null ? '<p class="help-note">Available once the content is loaded.</p>'
                : !list.length ? '<p class="help-ok">✓ Everything is filled in.</p>'
                : `<p class="help-warn">${list.length} text${list.length === 1 ? '' : 's'} still contain a [placeholder] or XX:</p>
                   <ul class="help-ph">${list.slice(0, 40).map(x => `<li><b>${esc(x.where)}</b> ${esc(x.text)}</li>`).join('')}</ul>`}
            </section>
          </div>
        </div>`;
    }
    const api = {
      async open() { await render(); el.hidden = false; el.querySelector('.help-x').focus(); },
      close() { el.hidden = true; },
      toggle() { if (el.hidden) api.open(); else api.close(); },
      isOpen: () => !el.hidden,
      fullscreen: toggleFullscreen,
      openNotes() { if (T.notesUrl) window.open(T.notesUrl(), 'pulse-presenter-view', 'width=1280,height=820'); },
      download: () => downloadSummary(T),
    };
    el.addEventListener('click', e => {
      if (e.target === el) return api.close();
      const b = e.target.closest('[data-h]');
      if (!b) return;
      const h = b.dataset.h;
      if (h === 'close') api.close();
      else if (h === 'full') toggleFullscreen();
      else if (h === 'notes') api.openNotes();
      else if (h === 'export') api.download();
      else if (h === 'lock') T.lock();
      else if (h === 'checkin') {
        const s = getState() || {};
        T.act('goto', s.extra ? 0 : PulseCore.firstExtra(T.config));
        api.close();
      }
    });
    return api;
  }

  root.PulseHelp = { mount, summaryHtml, downloadSummary, toggleFullscreen, placeholders };
})(typeof self !== 'undefined' ? self : this);

<script>
// Presenter view: a second window for the presenter's laptop. It shows the speaker notes, what is on the
// big screen now and what comes next, live counts and a clock, and it drives the show: the projector follows.
// mountNotes(rootElement, transport). Opened from the presenter guide ("Open presenter view").
(function (root) {
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const plain = s => String(s ?? '').replace(/[\[\]]/g, '');
  const KIND = { lobby: 'Join screen', recap: 'Recap', roadmap: 'Timeline', finale: 'Finale' };

  function titleOf(s) {
    if (s.stage === 'question') return s.question.title;
    if (s.stage === 'slide') return (s.slide && (s.slide.title || s.slide.type)) || s.nav;
    if (s.stage === 'lobby') return (s.lobby && s.lobby.title) || 'Join';
    if (s.stage === 'roadmap') return (s.roadmap && s.roadmap.title) || 'The road ahead';
    if (s.stage === 'recap') return (s.recap && s.recap.title) || 'Recap';
    if (s.stage === 'finale') return (s.finale && s.finale.title) || 'Finale';
    return s.nav;
  }
  function kindOf(s) {
    if (s.stage === 'question') return s.question.type === 'award' ? 'Award vote' : s.group === 'checkin' ? `Check-in poll ${s.qn} of ${s.qtotal}` : `Poll ${s.qn} of ${s.qtotal}`;
    if (s.stage === 'slide') return s.slide && s.slide.type === 'qa' ? 'Live Q&A' : s.slide && s.slide.type === 'tug' ? 'Tug of war' : s.slide && s.slide.type === 'kudos' ? 'Kudos wall' : 'Slide';
    return KIND[s.stage] || s.stage;
  }

  function mountNotes(rootEl, T) {
    document.title = 'Presenter view';
    document.body.classList.add('notes-mode');
    rootEl.innerHTML = `
      <div class="nv">
        <header class="nv-top">
          <b>Presenter view</b>
          <span id="nvPos"></span>
          <span class="nv-sp"></span>
          <span id="nvStatus" class="nv-status"></span>
          <span class="nv-clock" title="Time since you opened this view (click to restart)"><small>Running</small><b id="nvRun">0:00</b></span>
          <span class="nv-clock"><small>Time</small><b id="nvNow"></b></span>
          <button id="nvGuide" class="nv-ghost">Guide</button>
        </header>
        <div class="nv-main">
          <section class="nv-now">
            <div class="nv-k">On the big screen now · <span id="nvKind"></span></div>
            <h1 id="nvTitle"></h1>
            <div class="nv-live" id="nvLive"></div>
            <div class="nv-k nv-k2">Your notes</div>
            <div class="nv-notes" id="nvNotes"></div>
          </section>
          <aside class="nv-side">
            <div class="nv-next"><div class="nv-k">Next</div><b id="nvNext"></b></div>
            <div class="nv-btns">
              <button id="nvPrev" aria-label="Previous screen">← Back</button>
              <button id="nvNextBtn" class="nv-go" aria-label="Next screen">Next →</button>
            </div>
            <button id="nvReveal" class="nv-reveal" hidden>Reveal results (H)</button>
            <div class="nv-k">Jump to</div>
            <ol class="nv-list" id="nvList"></ol>
          </aside>
        </div>
      </div>`;
    const $ = id => document.getElementById(id);
    let latest = null, start = Date.now(), listKey = '';
    const help = root.PulseHelp ? PulseHelp.mount({ T, getState: () => latest }) : null;
    $('nvGuide').onclick = () => help && help.toggle();
    document.querySelector('.nv-clock').onclick = () => { start = Date.now(); tick(); };

    function act(a, arg) {
      if (!T.canControl) { $('nvStatus').textContent = T.controlHint || 'Enter the presenter key to control the show'; return; }
      if (a === 'reveal' && latest && latest.tug) { if (!['countdown', 'go'].includes(latest.tug.phase)) T.act('tug', 'start'); return; }
      if (a === 'reveal') a = latest && latest.revealed ? 'conceal' : 'reveal';
      T.act(a, arg);
    }
    $('nvPrev').onclick = () => act('prev');
    $('nvNextBtn').onclick = () => act('next');
    $('nvReveal').onclick = () => act('reveal');
    $('nvList').onclick = e => { const li = e.target.closest('li[data-i]'); if (li) act('goto', Number(li.dataset.i)); };

    const two = n => String(n).padStart(2, '0');
    function tick() {
      const sec = Math.floor((Date.now() - start) / 1000);
      $('nvRun').textContent = `${Math.floor(sec / 60)}:${two(sec % 60)}`;
      const d = new Date();
      $('nvNow').textContent = `${two(d.getHours())}:${two(d.getMinutes())}`;
      if (latest && latest.stage === 'question' && !latest.revealed && latest.timerTotal) liveInfo(latest);
    }
    setInterval(tick, 1000); tick();

    let timerBase = 0, timerAt = 0;
    function liveInfo(s) {
      const parts = [];
      if (s.stage === 'question') {
        const n = s.stats.n;
        parts.push(`<span><b>${n}</b> vote${n === 1 ? '' : 's'}</span>`);
        if (!s.revealed && s.timerTotal) { const left = Math.max(0, Math.ceil((timerBase - (Date.now() - timerAt)) / 1000)); parts.push(`<span><b>${left}</b> s left</span>`); }
        parts.push(`<span>${s.revealed ? 'Results shown' : 'Results hidden'}</span>`);
        if (s.revealed && s.stats.n) parts.push(`<span>Top: <b>${esc(plain(s.stats.top))}</b> (${s.stats.topPct}%)</span>`);
      } else if (s.stage === 'lobby') parts.push(`<span><b>${s.connected || 0}</b> phones connected</span>`);
      else if (s.tug) parts.push(`<span>Phase: <b>${esc(s.tug.phase || 'ready')}</b></span>`, `<span>Players <b>${s.tug.players[0]}</b> vs <b>${s.tug.players[1]}</b></span>`, `<span>Pulls <b>${s.tug.taps[0]}</b> vs <b>${s.tug.taps[1]}</b></span>`);
      else if (s.kudos) parts.push(`<span><b>${s.kudos.length}</b> kudos</span>`, ...s.kudos.slice(0, 3).map(k => `<span class="nv-q">For ${esc(k.to)} · ${esc(k.text)}</span>`));
      else if (s.qa) parts.push(`<span><b>${s.qa.length}</b> question${s.qa.length === 1 ? '' : 's'}</span>`, ...s.qa.slice(0, 3).map(x => `<span class="nv-q">▲ ${x.votes} · ${esc(x.text)}</span>`));
      else if (s.participants != null) parts.push(`<span><b>${s.participants}</b> people have voted so far</span>`);
      $('nvLive').innerHTML = parts.join('');
    }

    function render(s) {
      latest = s;
      if (s.stage === 'question') { timerBase = s.timeLeft || 0; timerAt = Date.now(); }
      $('nvPos').textContent = `Screen ${s.index + 1} of ${s.stepCount}${s.extra ? ' · February check-in' : ''}`;
      $('nvKind').textContent = kindOf(s);
      $('nvTitle').textContent = plain(titleOf(s));
      $('nvNotes').innerHTML = s.notes ? esc(s.notes).replace(/\[([^\]]*)\]/g, '<span class="ph">[$1]</span>').replace(/\n/g, '<br>') : '<span class="nv-empty">No notes for this screen. Add them as "notes" in the running order.</span>';
      $('nvNext').textContent = s.next || 'End of this part of the show';
      $('nvReveal').hidden = s.stage !== 'question' && !s.tug;
      $('nvReveal').textContent = s.tug ? (s.tug.phase === 'done' ? 'Rematch (H)' : 'Start the tug of war (H)') : s.revealed ? 'Hide results (H)' : s.question && s.question.type === 'award' ? 'Reveal the winner (H)' : 'Reveal results (H)';
      liveInfo(s);
      // the running order, built once from the content
      const steps = T.config ? PulseCore.steps(T.config) : null;
      if (steps) {
        const key = steps.length + ':' + s.index;
        if (key !== listKey) {
          listKey = key;
          $('nvList').innerHTML = steps.map((st, i) => `<li data-i="${i}" class="${i === s.index ? 'on' : ''} ${st.extra ? 'extra' : ''}" tabindex="0">${i + 1}. ${esc(PulseCore.navLabel(T.config, st))}</li>`).join('');
          const on = $('nvList').querySelector('.on');
          if (on) on.scrollIntoView({ block: 'nearest' });
        }
      }
    }
    if (!T.config && T.loadConfig) T.loadConfig().then(() => latest && render(latest));

    addEventListener('keydown', e => {
      if (e.target.closest && e.target.closest('input,textarea')) return;
      const k = e.key.toLowerCase();
      if (k === '?' || (k === '/' && e.shiftKey)) { e.preventDefault(); return help && help.toggle(); }
      if (help && help.isOpen()) { if (k === 'escape') help.close(); return; }
      if (['arrowright', ' ', 'pagedown'].includes(k)) { e.preventDefault(); act('next'); }
      else if (['arrowleft', 'pageup'].includes(k)) act('prev');
      else if (k === 'h' && latest && (latest.stage === 'question' || latest.tug)) act('reveal');
      else if (k === 'enter' && e.target.closest && e.target.closest('li[data-i]')) act('goto', Number(e.target.closest('li[data-i]').dataset.i));
    });
    T.onStatus = msg => ($('nvStatus').textContent = msg || '');
    T.subscribe(render, null);
  }

  root.mountNotes = mountNotes;
})(typeof self !== 'undefined' ? self : this);

</script>
<script>
// Presenter screen ("game show" style). mountHost(rootElement, transport).
// Screens: lobby → questions (race + reveal) → recap (thanks + pledges) → roadmap (animated timeline) → finale.
(function (root) {
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const emphasise = s => esc(s).replace(/(\d+%|“[^”]+”)/g, '<span class="hl">$1</span>');
  const LANES = ['#5fb8ff', '#3b6fff', '#8fd3ff', '#8f7bff', '#2fc6e0', '#a9b8ff'];
  const LIGHTS = ['#ffffff', '#8fd3ff', '#ffc400', '#5fb8ff'];
  const DAY = 864e5;
  const day = s => new Date(s + 'T00:00:00').getTime();
  const hash = w => [...String(w)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
  const moodOf = (o, i) => (typeof o.score === 'number' ? Math.max(3, o.score) : [5, 4, 5, 4, 5, 4][i % 6]);
  const CROWN = '<svg class="crown" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="none" stroke="#ffc400" stroke-width="2.5"/><circle class="ring-dash" cx="32" cy="32" r="30" fill="none" stroke="#fff3c4" stroke-width="2.5" stroke-dasharray="3 9" stroke-linecap="round"/></svg>';

  const PHONE = '<svg class="phone-ico" viewBox="0 0 40 60" aria-hidden="true"><rect x="3" y="3" width="34" height="54" rx="7" fill="#fff" stroke="#1d1b3a" stroke-width="3"/><rect x="10" y="14" width="8" height="8" fill="#1d1b3a"/><rect x="22" y="14" width="8" height="8" fill="#1d1b3a"/><rect x="10" y="26" width="8" height="8" fill="#1d1b3a"/><rect x="24" y="28" width="4" height="4" fill="#1d1b3a"/><rect x="22" y="34" width="8" height="2.5" fill="#1d1b3a"/><path class="scanline" d="M7 18 H33" stroke="#ff5a5f" stroke-width="2.5"/><rect x="15" y="47" width="10" height="3" rx="1.5" fill="#1d1b3a"/></svg>';

  const SHELL = `
  <div class="deck" id="deck">
    <div class="backdrop" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="rays" aria-hidden="true"></div>
    <canvas class="snow" id="snow" aria-hidden="true"></canvas>
    <canvas class="fireworks" id="fireworks" aria-hidden="true"></canvas>
    <div class="lights" id="lights" aria-hidden="true"></div>
    <div class="topbar">
      <span class="tag" id="team"></span>
      <span class="event" id="event"></span>
      <canvas class="pulse" id="pulse" aria-hidden="true"></canvas>
      <nav class="chapters" id="chapters" aria-label="Chapters"></nav>
      <span class="holiday" id="holiday"></span>
      <span class="live"><i></i>LIVE</span>
    </div>
    <div class="titleblock" id="titleblock"></div>
    <div id="content"></div>
    <div class="foot">
      <span class="foot-k" id="source"></span>
      <div class="ticker"><div class="ticker-in" id="ticker"></div></div>
      <span class="pager" id="pager"></span>
    </div>
  </div>
  <div class="wipe" id="wipe" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="slam" id="slam" aria-hidden="true"><span></span></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="toast" id="toast" role="status"></div>
  <div class="status" id="status"></div>
  <div class="controls" id="controls">
    <button data-a="prev" title="Previous (←)" aria-label="Previous">←</button>
    <span class="ctl-label" id="ctlLabel"></span>
    <button data-a="next" title="Next (→ or space)" aria-label="Next">→</button>
    <span class="ctl-sep"></span>
    <button data-a="reveal" id="ctlReveal" title="H">Reveal now</button>
    <button data-a="snow" id="ctlSnow" title="S">Snow on</button>
    <button data-a="sim" id="ctlSim" hidden>▶ Simulate the room</button>
    <button data-a="reset" id="ctlReset">Reset</button>
    <span class="ctl-sep"></span>
    <button data-a="full" title="F">Full screen</button>
    <button data-a="help" title="?">Guide</button>
  </div>`;

  function mountHost(rootEl, T) {
    rootEl.innerHTML = SHELL;
    document.body.classList.add('presenting');
    const $ = id => document.getElementById(id);
    const U = () => Math.min(innerWidth / 100, innerHeight * 1.7778 / 100);

    const snow = new FX.Snow($('snow'), { rgb: '255,255,255', intensity: .9 });
    const pulse = new FX.PulseLine($('pulse'), { color: '#8fd3ff' });
    const confetti = new FX.Confetti($('confetti'));
    const fireworks = new FX.Fireworks($('fireworks'));
    buildLights();

    let view = null, latest = null, transitioning = false, fresh = false;
    let lastTicker = '', lastN = null, revealedPrev = null, cardsKey = '', titleKey = '';
    let timers = [];
    const later = (fn, ms) => timers.push(setTimeout(fn, ms));
    const cloudEls = new Map();

    // ---------- string lights (flash on every vote) ----------
    function buildLights() {
      const n = 28;
      let html = '<svg class="wire" viewBox="0 0 1000 60" preserveAspectRatio="none"><path d="M-5 6 Q 125 52 250 8 Q 375 52 500 8 Q 625 52 750 8 Q 875 52 1005 6"/></svg>';
      for (let i = 0; i < n; i++) {
        const x = (i + .5) / n, seg = (x * 4) % 1, y = 8 + 4 * seg * (1 - seg) * 21;
        html += `<i style="left:${(x * 100).toFixed(2)}%;top:${(y / 60 * 100).toFixed(1)}%;--c:${LIGHTS[i % LIGHTS.length]};--d:${(Math.random() * 2.4).toFixed(2)}s"></i>`;
      }
      $('lights').innerHTML = html;
    }
    function flashLights() { const l = $('lights'); l.classList.remove('flash'); void l.offsetWidth; l.classList.add('flash'); }

    // The countdown chip in the top bar: days to the date in config.countdown (falls back to the holiday break).
    const CAL = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 10 H20.5 M8 3 V7 M16 3 V7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="7" y="13" width="4" height="4" rx="1" fill="currentColor"/></svg>';
    function countdownChip(s) {
      const c = s.countdown || (s.holidayDate ? { date: s.holidayDate, label: 'the holiday break' } : null);
      if (!c || !c.date) return '';
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const d = Math.round((day(c.date) - today.getTime()) / DAY);
      const what = c.label || 'the big day', What = what.charAt(0).toUpperCase() + what.slice(1);
      const txt = d > 1 ? `${d} days to ${what}` : d === 1 ? `${What} starts tomorrow!` : d === 0 ? `${What} starts today!` : (c.after || `${What} is under way`);
      return `${c.date === s.holidayDate ? icon('help:snow') : CAL}<span>${esc(txt)}</span>`;
    }

    // Big bouncy title: each letter its own colour, bouncing in a wave.
    function bouncy(text, cls = '') {
      let i = 0;
      return `<h1 class="bouncy ${cls}">` + String(text).split(' ').map(word =>
        `<span class="word">${[...word].map(ch => `<span style="--i:${i};--c:${LANES[i++ % LANES.length]}">${esc(ch)}</span>`).join('')}</span>`
      ).join('<span class="sp"> </span>') + '</h1>';
    }

    // ---------- routing between screens ----------
    const LABELS = { lobby: 'Lobby', recap: 'Recap', roadmap: 'Road ahead', finale: 'Finale' };
    function render(s, meta = {}) {
      latest = s;
      $('team').textContent = s.team;
      $('event').textContent = s.event;
      $('holiday').innerHTML = countdownChip(s);
      renderChapters(s);
      const label = s.stage === 'question' ? (s.question.type === 'award' ? 'Award vote' : s.group === 'checkin' ? `Check-in ${s.qn} of ${s.qtotal}` : `Q${s.qn} of ${s.qtotal}`) : s.nav || LABELS[s.stage] || '';
      $('pager').textContent = `${s.index + 1} / ${s.stepCount}`;
      $('ctlLabel').textContent = label;
      $('ctlReveal').hidden = s.stage !== 'question' && !s.tug;
      $('ctlReveal').textContent = s.tug ? (s.tug.phase === 'done' ? 'Rematch' : 'Start the tug of war') : s.revealed ? 'Hide results' : 'Reveal now';
      if (meta.pop) { pulse.spike(1); flashLights(); }

      const v = s.stage === 'question' || s.stage === 'slide' ? s.stage + s.index : s.stage;
      if (v !== view) {
        const first = view === null;
        view = v;
        if (first || FX.reduce) { build(s); paint(latest, meta); return; }
        transitioning = true;

    function build(s) {
      timers.forEach(clearTimeout); timers = [];

      (builders[s.stage] || buildLobby)(s);

    // ---------- BAR CHART slide: stacked columns (e.g. reported quarters + an outlook), one axis, with a takeaway ----------
    // slide = { type: 'chart', bars: [{ label, note, parts: [{ label, value, max?, outlook? }], total? }], unit, callout, source }
    // Colour shows what kind of figure it is, not the year: reported is solid, the outlook is the same hue hatched.
    // Validated against the dark slide surface (dataviz validator).
    const CHART_COLOR = '#38a0ea';
    function drawBarChart(sl) {
      const box = $('chBox');
      if (!box) return;
      const W = box.clientWidth, H = box.clientHeight, u = U();
      const bars = sl.bars || [];
      const sum = b => b.parts.reduce((t, p) => t + (p.max != null ? (p.value + p.max) / 2 : p.value), 0);
      const top = b => b.parts.reduce((t, p) => t + (p.max != null ? p.max : p.value), 0);
      const step = 10, maxV = Math.ceil(Math.max(...bars.map(top)) * 1.08 / step) * step;
      const padL = u * 4.2, padR = u * 1, padT = u * 4.4, padB = u * 4.6;
      const pw = W - padL - padR, ph2 = H - padT - padB;
      const y = v => padT + ph2 - (v / maxV) * ph2;
      const bw = Math.min(u * 11, pw / (bars.length * 2.2)), gap = 2;
      const cx = i => padL + pw * (i + .5) / bars.length;
      const fmt = v => (Math.round(v * 10) / 10).toLocaleString('en-GB', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
      let svg = `<defs><pattern id="chHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="${CHART_COLOR}" opacity=".28"/><line x1="0" y1="0" x2="0" y2="8" stroke="${CHART_COLOR}" stroke-width="3"/></pattern></defs>`;
      for (let v = 0; v <= maxV; v += step) svg += `<line class="ch-grid ${v ? '' : 'base'}" x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}"/><text class="ch-ylab" x="${padL - u * .7}" y="${y(v)}" dy=".35em">${v}</text>`;
      let html = '', k = 0;
      bars.forEach((b, i) => {
        let acc = 0;
        b.parts.forEach((p, j) => {
          const v = p.max != null ? (p.value + p.max) / 2 : p.value;
          const y0 = y(acc), y1 = y(acc + v), last = j === b.parts.length - 1;
          const h = Math.max(1, y0 - y1 - (acc > 0 ? gap : 0));
          const x = cx(i) - bw / 2, yTop = y1;
          const r = last ? 4 : 0;
          const path = `M${x} ${yTop + h} V${yTop + r} Q${x} ${yTop} ${x + r} ${yTop} H${x + bw - r} Q${x + bw} ${yTop} ${x + bw} ${yTop + r} V${yTop + h} Z`;
          const tip = `${b.label}${p.label ? ' ' + p.label : ''}: €${p.max != null ? `${fmt(p.value)}–${fmt(p.max)}` : fmt(v)} bn${p.outlook ? ' (outlook)' : ''}`;
          svg += `<path class="ch-seg ${p.outlook ? 'outlook' : ''}" style="--k:${k};transform-origin:${cx(i)}px ${y(0)}px" d="${path}" fill="${p.outlook ? 'url(#chHatch)' : CHART_COLOR}" ${p.outlook ? `stroke="${CHART_COLOR}" stroke-width="1.5" stroke-dasharray="4 3"` : ''}><title>${esc(tip)}</title></path>`;
          // a bar of one part needs no label inside: its total sits on top
          if (b.parts.length > 1 && h > u * 2.4) html += `<div class="ch-in ${p.outlook ? 'outlook' : ''}" style="left:${cx(i)}px;top:${yTop + h / 2}px;--k:${k}"><b>${esc(p.label)}</b> ${p.max != null ? `${fmt(p.value)}–${fmt(p.max)}` : fmt(v)}</div>`;
          // the outlook range shows in the segment label and the total (a whisker of a few pixels would only look like noise)
          acc += v; k++;
        });
        html += `<div class="ch-total" style="left:${cx(i)}px;top:${y(top(b))}px;--k:${k}">${esc(b.total || '€' + fmt(sum(b)) + ' bn')}</div>`;
        html += `<div class="ch-xlab" style="left:${cx(i)}px;top:${y(0)}px"><b>${esc(b.label)}</b>${b.note ? `<span>${esc(b.note)}</span>` : ''}</div>`;
      });
      box.innerHTML = `<svg class="ch-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc((sl.title || '') + ': ' + bars.map(b => `${b.label} ${b.total || fmt(sum(b))}`).join(', '))}">${svg}</svg>${html}
        <div class="ch-unit" style="left:${padL - u * .7}px;top:${padT - u * 2.2}px">${esc(sl.unit || '')}</div>`;
    }

    // ---------- TUG OF WAR: Team Debit vs Team Credit ----------
    // The presenter starts a round (H). The projector runs it: 3-2-1, then "PULL!" for `seconds`, then it freezes
    // the score. Phones tap; the rope follows the share of pulls. H again starts a rematch.
    const TUG_COLORS = ['#5fb8ff', '#a08cff'];
    let tugRun = {}, tugPos = 0, tugAim = 0, tugRaf = 0, tugLast = [0, 0];
    function buildTug(s) {
      const sl = s.slide || {}, teams = sl.teams || ['Debit', 'Credit'], secs = sl.seconds || 20;
      $('titleblock').innerHTML = `${bouncy(sl.title || 'Tug of war', 'mid')}${sl.subtitle ? `<p class="sub">${ph(sl.subtitle)}</p>` : ''}`;
      const crew = k => Array.from({ length: 5 }, (_, i) => `<i style="--i:${i}">${orb(TUG_COLORS[k])}</i>`).join('');
      const team = k => `
        <div class="tug-team t${k}" id="tugT${k}" style="--c:${TUG_COLORS[k]}">
          <div class="tug-name">Team ${esc(teams[k])}</div>
          <div class="tug-n"><b id="tugN${k}" data-v="0">0</b><span>pulls</span></div>
          <div class="tug-p"><b id="tugP${k}">0</b> players</div>
          <div class="tug-crown">${TROPHY}<span>Winner</span></div>
        </div>`;
      $('content').innerHTML = `
        <div class="tug" id="tug" data-phase="ready">
          <div class="tug-head">${team(0)}
            <div class="tug-mid"><div class="tug-big" id="tugBig">${secs}</div><div class="tug-msg" id="tugMsg">Get your thumbs ready</div></div>
          ${team(1)}</div>
          <div class="tug-field">
            <div class="tug-zone z0"></div><div class="tug-zone z1"></div><div class="tug-line"></div>
            <div class="tug-rope" id="tugRope">
              <div class="tug-crew c0" style="--c:${TUG_COLORS[0]}">${crew(0)}</div>
              <div class="tug-cord"><i></i></div>
              <div class="tug-knot"><i></i></div>
              <div class="tug-crew c1" style="--c:${TUG_COLORS[1]}">${crew(1)}</div>
            </div>
          </div>
          <div class="tug-foot"><div class="qr">${T.qrHtml()}</div><span>Your phone already picked your team. When the screen says <b>PULL!</b>, tap as fast as you can.</span></div>
        </div>`;
      $('source').textContent = T.canControl ? 'Press H to start · H again for a rematch' : 'Tug of war';
      $('ticker').innerHTML = '';
      tugRun = {}; tugPos = tugAim = 0; tugLast = [0, 0];
      cancelAnimationFrame(tugRaf);

        const rope = $('tugRope');
        if (!rope) return;
        tugPos += (tugAim - tugPos) * .07;
        rope.style.setProperty('--p', tugPos.toFixed(4));
        tugRaf = requestAnimationFrame(loop);
      };
      loop();
    }
    function tugAct(what) { if (T.canControl) T.act('tug', what); }
    function paintTug(s) {
      const el = $('tug');
      if (!el) return;
      const t = s.tug, sl = s.slide || {}, teams = sl.teams || ['Debit', 'Credit'], secs = sl.seconds || 20;
      const [a, b] = t.taps;
      el.dataset.phase = t.phase || 'ready';
      FX.tween($('tugN0'), a); FX.tween($('tugN1'), b);
      $('tugP0').textContent = t.players[0]; $('tugP1').textContent = t.players[1];
      [a, b].forEach((v, k) => { if (v > tugLast[k]) { const tm = $('tugT' + k); tm.classList.remove('pull'); void tm.offsetWidth; tm.classList.add('pull'); el.classList.toggle('pull' + k, true); setTimeout(() => el.classList.remove('pull' + k), 380); } });
      tugLast = [a, b];
      const total = a + b;
      if (t.phase !== 'done') tugAim = total ? Math.max(-1, Math.min(1, ((b - a) / Math.max(total, 24)) * 1.8)) : 0;
      if (!t.id || t.phase === 'ready') {
        el.classList.remove('won0', 'won1', 'draw');
        $('tugBig').textContent = secs;
        $('tugMsg').textContent = t.players[0] + t.players[1] ? `${t.players[0] + t.players[1]} players on the rope` : 'Get your thumbs ready';
      } else if (t.phase === 'countdown' && tugRun.id !== t.id) {
        tugRun = { id: t.id };
        el.classList.remove('won0', 'won1', 'draw');
        $('tugMsg').textContent = 'Get ready…';
        [3, 2, 1].forEach((n, i) => later(() => { if (latest.tug && latest.tug.id === t.id && latest.tug.phase === 'countdown') { const big = $('tugBig'); big.textContent = n; big.classList.remove('beat'); void big.offsetWidth; big.classList.add('beat'); pulse.spike(.6); } }, i * 1000));
        later(() => tugAct('go:' + t.id), 3000);
      } else if (t.phase === 'go') {
        if (tugRun.go !== t.id) {
          tugRun = { id: t.id, go: t.id };
          slam('PULL!'); flashLights();
          const tick = () => {
            const cur = latest && latest.tug;
            if (!$('tugBig') || !cur || cur.id !== t.id || cur.phase !== 'go') return;
            const left = Math.max(0, secs * 1000 - (Date.now() - (cur.goAt || Date.now())));
            $('tugBig').textContent = Math.ceil(left / 1000);
            $('tugBig').classList.toggle('hurry', left < 5500);
            if (left > 0) later(tick, 200);
            else tugAct(`done:${t.id}:${cur.taps[0]}:${cur.taps[1]}`);
          };
          tick();

        $('tugMsg').textContent = a === b ? 'Neck and neck!' : `Team ${teams[a > b ? 0 : 1]} is pulling ahead!`;
      } else if (t.phase === 'done' && tugRun.done !== t.id) {

    // ---------- KUDOS WALL ----------
    // Colleagues thank each other from their phones. One card at a time is in the spotlight (a new one goes there
    // straight away); the rest form a living wall. The presenter can remove a card with a click (U brings it back).
    const KUDOS_KINDS = {
      thanks: { label: 'Thank you', icon: 'help:heart', c: '#5fb8ff' },
      hero: { label: 'Hero of the year', icon: 'help:trophy', c: '#ffc400' },
      team: { label: 'Team player', icon: 'help:team', c: '#a08cff' },
      calm: { label: 'Calm in the storm', icon: 'help:snow', c: '#8fd3ff' },
      boost: { label: 'Energy boost', icon: 'help:boost', c: '#2fc6e0' },
    };
    const kudosKind = k => KUDOS_KINDS[k] || KUDOS_KINDS.thanks;
    const kudosTilt = id => { let h = 0; for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) | 0; return ((Math.abs(h) % 7) - 3) * .4; };
    const kudosCard = (k, cls = '') => {
      const m = kudosKind(k.kind);
      return `<div class="kd-card ${cls}" data-id="${esc(k.id)}" style="--c:${m.c};--t:${kudosTilt(k.id)}deg">

        <p class="kd-text">${esc(k.text)}</p>
      </div>`;
    };
    let kwKey = null, kwFeat = 0, kwSeen = new Set(), kwFeatId = '', kwSince = 0;
    function buildKudos(s) {
      const sl = s.slide || {};
      $('titleblock').innerHTML = `
        <div class="pk-head">
          <div>${bouncy(sl.title || 'Kudos wall', 'mid')}${sl.subtitle ? `<p class="sub">${ph(sl.subtitle)}</p>` : ''}</div>
          <div class="kw-join st" style="--i:1"><div class="qr">${T.qrHtml()}</div><div><b id="kwN" data-v="0">0</b><span>kudos sent</span><small>Scan to send one</small></div></div>
        </div>`;
      $('content').innerHTML = `<div class="kw" id="kw"><div class="kw-feature" id="kwFeature"></div><div class="kw-wall" id="kwWall"></div></div>`;
      $('source').textContent = T.canControl ? 'Click a card to remove it · U brings removed cards back' : 'Kudos wall';
      $('ticker').innerHTML = '';
      kwKey = null; kwFeat = 0; kwSeen = new Set(); kwFeatId = ''; kwSince = Date.now();
      // every card gets about seven seconds in the spotlight; a new kudos starts its own seven seconds
      const rotate = () => { if (!$('kw')) return; if (Date.now() - kwSince > 7000) { kwFeat++; showFeature(latest, true); kwSince = Date.now(); } later(rotate, 500); };
      later(rotate, 500);

    function showFeature(s, rotating) {
      const list = (s && s.kudos) || [], box = $('kwFeature');
      if (!box || !list.length) return;
      const f = list[kwFeat % list.length];
      if (f.id === kwFeatId) return;
      kwFeatId = f.id;
      kwSince = Date.now();
      box.innerHTML = kudosCard(f, 'feat');

    }
    function paintKudos(s) {
      const list = s.kudos || [], wall = $('kwWall');

      FX.tween($('kwN'), list.length);
      const key = list.map(k => k.id).join(',');
      if (key === kwKey) return;
      kwKey = key;
      if (!list.length) {
        $('kwFeature').innerHTML = `<div class="kd-card feat kd-invite"><div class="kd-top"><span class="kd-ico">${icon('help:heart')}</span><span class="kd-kind">Kudos</span></div>
          <p class="kd-text">Who deserves a thank-you?</p><div class="kd-to">Scan the code and send a kudos to a colleague or a whole team. It appears right here.</div></div>`;
        wall.innerHTML = [0, 1, 2, 3, 4, 5].map(i => `<div class="kd-card kd-ghost" style="--t:${(i % 3 - 1) * .5}deg"><i></i><i></i><i></i></div>`).join('');

      // a new kudos goes straight into the spotlight

    }

    // ---------- live Q&A board ----------

    function paint(s, meta) {

    // ---------- LOBBY ----------
    function buildLobby(s) {
