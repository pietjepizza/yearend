<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mood Pulse · Presenter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="/icons.js"></script>
</head>
<body class="presenting">
<div class="deck" id="deck">
  <div class="topbar">
    <span class="team" id="team"></span><span class="sep"></span><span id="event"></span>
    <span class="spacer"></span>
    <span class="live"><i></i>Live</span>
  </div>
  <div class="titleblock">
    <div class="kicker" id="kicker"></div>
    <h1 class="action-title" id="title"></h1>
  </div>
  <div id="content"></div>
  <div class="foot">
    <span id="source"></span>
    <div class="ticker"><div class="ticker-in" id="ticker"></div></div>
    <span class="pager" id="pager"></span>
  </div>
</div>
<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>
<div class="status" id="status"></div>
<div class="help">→ next · ← back · H hide/reveal results · click a word to hide it · U restore hidden words · C clear question</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const key = new URLSearchParams(location.search).get('key') || '';
const U = () => Math.min(innerWidth / 100, innerHeight * 1.7778 / 100); // px per slide unit
let view = null, latest = null, lastTitle = '', lastTicker = '', lastN = null;

const RING = '<svg class="ring" viewBox="0 0 100 50" preserveAspectRatio="none" aria-hidden="true"><path d="M90 14 C 80 2, 22 0, 8 14 C -4 28, 24 49, 60 46 C 94 43, 104 24, 80 8"/></svg>';
const ARROW = '<svg viewBox="0 0 32 26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3 C 12 4, 24 10, 29 22"/><path d="M29 22 L 21 20 M29 22 L 30 13"/></svg>';

// ---------- small helpers ----------
function tween(el, to, fmt = v => Math.round(v)) {
  if (!el) return;
  const from = Number(el.dataset.v || 0); el.dataset.v = to;
  if (from === to) { el.textContent = fmt(to); return; }
  const t0 = performance.now(), d = 700;
  const step = t => { const k = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (to - from) * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function setTitle(html, waiting) {
  const t = $('title');
  t.classList.toggle('waiting', !!waiting);
  if (html === lastTitle) return;
  lastTitle = html; t.innerHTML = html;
  t.classList.remove('swap'); void t.offsetWidth; t.classList.add('swap');
}
const emphasise = s => esc(s).replace(/(\d+%|“[^”]+”)/g, '<span class="hl">$1</span>');

// ---------- question view ----------
function buildQuestion(s) {
  const q = s.question, scored = q.options.some(o => typeof o.score === 'number');
  cloudEls.clear(); lastN = null;
  $('content').innerHTML = `
    <div class="body" id="body">
      <div class="exhibit">
        <div class="panel-h"><span><b>Exhibit ${s.index + 1}a</b> · Distribution of responses, % of respondents</span><span id="nlabel"></span></div>
        <div class="rows">
          ${q.options.map(o => `
            <div class="row" data-id="${esc(o.id)}">
              <div class="ic">${icon(o.icon)}</div>
              <div class="main">
                <div class="line">
                  <span class="lab">${esc(o.label)}</span>
                  <span class="val"><span class="pct" data-v="0">0%</span><span class="cnt"></span>${RING}${o.note ? `<span class="note">${esc(o.note)}${ARROW}</span>` : ''}</span>
                </div>
                <div class="track"><div class="fill"></div></div>
              </div>
            </div>`).join('')}
        </div>
      </div>
      <div class="cloud-panel">
        <div class="panel-h"><span><b>Exhibit ${s.index + 1}b</b> · In their own words</span><span id="wlabel"></span></div>
        <div class="cloud ${key ? 'can-edit' : ''}" id="cloud"><div class="w" id="measure" style="visibility:hidden;transition:none"></div></div>
        <div class="cloud-empty" id="cloudEmpty">Words from the room<br>will appear here</div>
        <div class="veil"><span>Results under embargo…</span></div>
      </div>
      <aside class="side">
        <div class="kpis">
          <div class="kpi"><div class="k">Responses</div><div class="v" id="k-n" data-v="0">0</div></div>
          ${scored
            ? `<div class="kpi"><div class="k">Pulse index</div><div class="v"><span id="k-avg" data-v="0">–</span><small>/ 5</small></div></div>
               <div class="kpi wide"><div class="k">Positive share (top-2 box)</div><div class="v"><span id="k-top" data-v="0">–</span><small>%</small></div><div class="meter"><i id="k-meter"></i></div></div>`
            : `<div class="kpi"><div class="k">Leading</div><div class="v"><span id="k-lead" data-v="0">–</span><small>%</small></div></div>
               <div class="kpi wide"><div class="k">Top answer</div><div class="v txt" id="k-lab">–</div></div>`}
        </div>
        <div class="join">
          <div class="qr"><img src="/qr.svg" alt="QR code to join"></div>
          <div class="k">Scan to join</div>
          <div class="url">${esc(s.joinUrl.replace(/^https?:\/\//, ''))}</div>
          <div class="hint">100% anonymous · 10 seconds</div>
        </div>
      </aside>
    </div>`;
}

function renderQuestion(s) {
  const q = s.question, n = s.stats.n;
  $('kicker').innerHTML = `<b>Q${s.index + 1}</b>${esc(q.title)}`;
  if (!n) setTitle('Waiting for the first responses…', true);
  else if (!s.revealed) setTitle('Results are coming in…', true);
  else setTitle(emphasise(s.takeaway));

  $('body').classList.toggle('concealed', !s.revealed);
  $('nlabel').textContent = `n = ${n}`;
  const max = Math.max(1, ...Object.values(s.counts));
  for (const row of document.querySelectorAll('.row')) {
    const c = s.counts[row.dataset.id] || 0, pct = n ? Math.round(100 * c / n) : 0;
    row.querySelector('.fill').style.width = (c / max) * 100 + '%';
    tween(row.querySelector('.pct'), pct, v => Math.round(v) + '%');
    row.querySelector('.cnt').textContent = `(${c})`;
    row.classList.toggle('top', n > 0 && row.dataset.id === s.stats.topId);
  }
  tween($('k-n'), n);
  if ($('k-avg')) {
    if (s.stats.avg != null) tween($('k-avg'), s.stats.avg, v => v.toFixed(1)); else $('k-avg').textContent = '–';
    if (s.stats.topBox != null) { tween($('k-top'), s.stats.topBox); $('k-meter').style.width = s.stats.topBox + '%'; } else $('k-top').textContent = '–';
  } else {
    tween($('k-lead'), s.stats.topPct);
    $('k-lab').textContent = s.stats.top || '–';
  }
  if (s.pop && s.revealed) bump(s.pop);
  layoutCloud(s);

  const tick = (s.recent || []).map(w => `<span>${esc(w)}</span>`).join('');
  if (tick !== lastTicker) { lastTicker = tick; $('ticker').innerHTML = tick; }
  $('ticker').parentElement.classList.toggle('off', !s.revealed);
  $('source').textContent = `Source: live pulse, ${s.team}, n = ${n}`;

  if (lastN !== null && n > lastN) {
    const hit = [10, 25, 50, 75, 100, 150, 200, 250, 300, 400, 500].find(m => lastN < m && n >= m);
    if (hit) celebrate(`🎉 ${hit} responses and counting!`);
  }
  lastN = n;
}

function bump(id) {
  const row = document.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
  if (!row) return;
  row.classList.remove('bump'); void row.offsetWidth; row.classList.add('bump');
  const p = document.createElement('div'); p.className = 'plus'; p.textContent = '+1';
  row.querySelector('.main').appendChild(p); setTimeout(() => p.remove(), 1200);
}

// ---------- word cloud (spiral placement, animated) ----------
const cloudEls = new Map(); // word -> { el, n }
const INKS = ['var(--ink)', 'var(--brand)', '#3b6fd8', '#2a8fd6', '#5a4fcf', 'var(--muted)'];
const hash = w => [...w].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);

function layoutCloud(s) {
  const box = $('cloud'), measure = $('measure');
  if (!box) return;
  const entries = Object.entries(s.words).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 45);
  $('cloudEmpty').hidden = entries.length > 0;
  const total = entries.reduce((a, [, c]) => a + c, 0);
  $('wlabel').textContent = total ? `${entries.length} unique of ${total}` : '';

  const W = box.clientWidth, H = box.clientHeight, u = U();
  const hi = entries.length ? entries[0][1] : 1, lo = entries.length ? entries[entries.length - 1][1] : 1;
  const maxF = u * (entries.length > 28 ? 3.1 : entries.length > 14 ? 3.7 : 4.4), minF = u * 1.2, pad = u * .55;
  const placed = [], seen = new Set();

  entries.forEach(([w, n], i) => {
    seen.add(w);
    const t = hi === lo ? (entries.length === 1 ? 1 : .35) : Math.sqrt((n - lo) / (hi - lo));
    const fs = minF + (maxF - minF) * t;
    measure.style.fontSize = fs + 'px'; measure.firstChild ? measure.firstChild.textContent = w : measure.innerHTML = `<i>${esc(w)}</i>`;
    const bw = measure.offsetWidth, bh = measure.offsetHeight;
    let pos = null;
    for (let k = 0; k < 2400 && !pos; k++) {
      const a = k * .22, r = u * .28 * a;
      const x = W / 2 + r * Math.cos(a) * 1.3 - bw / 2, y = H / 2 + r * Math.sin(a) * .85 - bh / 2;
      if (x < 0 || y < 0 || x + bw > W || y + bh > H) continue;
      if (placed.some(p => x < p.x + p.w + pad && x + bw + pad > p.x && y < p.y + p.h + pad * .4 && y + bh + pad * .4 > p.y)) continue;
      pos = { x, y, w: bw, h: bh };
    }
    let rec = cloudEls.get(w);
    if (!rec) {
      const el = document.createElement('div');
      el.className = 'w new'; el.innerHTML = `<i>${esc(w)}</i>`;
      el.title = key ? 'Click to hide this word' : '';
      el.onclick = () => key && act('hide', `&word=${encodeURIComponent(w)}`);
      box.appendChild(el);
      rec = { el, n };
      cloudEls.set(w, rec);
      if (pos) { el.style.transition = 'none'; el.style.fontSize = fs + 'px'; el.style.transform = `translate(${pos.x}px,${pos.y}px)`; void el.offsetWidth; el.style.transition = ''; }
    } else if (n > rec.n) {
      rec.el.classList.remove('grow', 'new'); void rec.el.offsetWidth; rec.el.classList.add('grow');
    }
    rec.n = n;
    if (!pos) { rec.el.style.opacity = 0; return; }
    placed.push(pos);
    Object.assign(rec.el.style, { opacity: '', fontSize: fs + 'px', transform: `translate(${pos.x}px,${pos.y}px)`, color: i === 0 ? 'var(--brand)' : INKS[hash(w) % INKS.length] });
  });
  for (const [w, rec] of cloudEls) if (!seen.has(w)) { rec.el.remove(); cloudEls.delete(w); }
}

// ---------- summary view ----------
function renderSummary(s) {
  $('kicker').innerHTML = `<b>Summary</b>What we heard today`;
  const idx = s.items.map(it => it.stats.avg).filter(v => v != null);
  const avgAll = idx.length ? (idx.reduce((a, b) => a + b, 0) / idx.length).toFixed(1) : '–';
  const wordsAll = s.items.reduce((a, it) => a + Object.values(it.words).reduce((x, y) => x + y, 0), 0);
  setTitle(`Executive summary: <span class="hl">${s.participants}</span> colleagues gave their pulse`);
  $('content').innerHTML = `<div class="summary" style="--cols:${s.items.length}">${s.items.map((it, i) => {
    const opt = it.options.find(o => o.id === it.stats.topId);
    const chips = Object.entries(it.words).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([w]) => `<span>${esc(w)}</span>`).join('');
    return `<div class="sum-card">
      <div class="num">0${i + 1}</div>
      <div class="q">${esc(it.title)}</div>
      <div class="t">${it.takeaway ? emphasise(it.takeaway) : '<span style="color:var(--faint)">No responses</span>'}</div>
      ${chips ? `<div class="chips">${chips}</div>` : ''}
      <div class="top">${opt ? `<span class="ic">${icon(opt.icon)}</span><span><b>${esc(opt.label)}</b> · ${it.stats.topPct}%</span>` : ''}${it.stats.avg != null ? `<span class="idx">Index ${it.stats.avg}/5</span>` : ''}</div>
    </div>`;
  }).join('')}</div>
  <div class="sum-band">
    <div><div class="k">Participants</div><div class="v">${s.participants}</div></div>
    <div><div class="k">Avg. pulse index</div><div class="v">${avgAll}<small> / 5</small></div></div>
    <div><div class="k">Words shared</div><div class="v">${wordsAll}</div></div>
    <div class="thanks">Thank you, ${esc(s.team)}! On to 2027 →</div>
  </div>`;
  $('ticker').innerHTML = ''; lastTicker = '';
  $('source').textContent = `Source: live pulse, ${s.team}`;
}

function render(s) {
  latest = s;
  $('team').textContent = s.team;
  $('event').textContent = s.event;
  $('pager').innerHTML = s.summary ? '<b>Summary</b>' : `<b>${s.index + 1}</b> / ${s.total}`;
  const v = s.summary ? 'summary' : 'q' + s.index;
  const entering = v !== view;
  if (entering) { view = v; if (!s.summary) buildQuestion(s); }
  if (s.summary) { renderSummary(s); if (entering) setTimeout(() => confetti('cannons'), 300); }
  else renderQuestion(s);
}

// ---------- fun: reactions, confetti, toasts ----------
let floaters = 0;
function floatReaction(r) {
  if (floaters > 45) return;
  floaters++;
  const d = document.createElement('div');
  d.className = 'reaction'; d.textContent = r;
  const dur = 3.2 + Math.random() * 1.4;
  d.style.left = (3 + Math.random() * 90) + 'vw';
  d.style.setProperty('--dx', (Math.random() * 14 - 7) + 'vw');
  d.style.setProperty('--dur', dur + 's');
  document.body.appendChild(d);
  setTimeout(() => { d.remove(); floaters--; }, dur * 1000);
}

let toastTimer;
function celebrate(text) {
  const t = $('toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
  confetti('top');
}

const COLORS = ['#10069f', '#3b2fe0', '#5fb8ff', '#ffc400', '#0b0b3b', '#d7263d'];
let parts = [], running = false;
function confetti(kind) {
  const c = $('confetti'), dpr = devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  const W = innerWidth, H = innerHeight;
  const spawn = (x, y, angle, spread, speed, count) => {
    for (let i = 0; i < count; i++) {
      const a = angle + (Math.random() - .5) * spread, v = speed * (.55 + Math.random() * .6);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * 6, vr: (Math.random() - .5) * .3,
        w: 6 + Math.random() * 8, h: 4 + Math.random() * 6, c: COLORS[(Math.random() * COLORS.length) | 0], life: 0 });
    }
  };
  if (kind === 'cannons') { spawn(0, H, -Math.PI / 3, .7, H * .032, 140); spawn(W, H, -Math.PI * 2 / 3, .7, H * .032, 140); }
  else spawn(W / 2, -10, Math.PI / 2, 2.4, H * .012, 110);
  if (running) return;
  running = true;
  const ctx = c.getContext('2d');
  const frame = () => {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    parts = parts.filter(p => p.y < H + 40 && p.life < 420);
    for (const p of parts) {
      p.life++; p.vy += .32; p.vx *= .99; p.vy *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.scale(1, Math.cos(p.life * .15));
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    }
    if (parts.length) requestAnimationFrame(frame); else { running = false; ctx.clearRect(0, 0, W, H); }
  };
  requestAnimationFrame(frame);
}

// ---------- wiring ----------
function connect() {
  const es = new EventSource('/events?role=host');
  es.onopen = () => $('status').textContent = '';
  es.onmessage = e => render(JSON.parse(e.data));
  es.addEventListener('react', e => floatReaction(JSON.parse(e.data).r));
  es.onerror = () => { $('status').textContent = 'Reconnecting…'; es.close(); setTimeout(connect, 2000); };
}
connect();
addEventListener('resize', () => { if (latest && !latest.summary) layoutCloud(latest); });
document.fonts && document.fonts.ready.then(() => latest && !latest.summary && layoutCloud(latest));

async function act(a, extra = '') {
  const r = await fetch(`/api/host/${a}?key=${encodeURIComponent(key)}${extra}`, { method: 'POST' });
  if (r.status === 403) $('status').textContent = 'Add the host key to the URL (?key=…) to control the screen';
}
addEventListener('keydown', e => {
  if (['ArrowRight', ' ', 'PageDown'].includes(e.key)) act('next');
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) act('prev');
  else if (e.key.toLowerCase() === 'h') act('reveal');
  else if (e.key.toLowerCase() === 'u') act('unhide');
  else if (e.key.toLowerCase() === 'c' && confirm('Clear all answers for this question?')) act('clear');
});
</script>
</body>
</html>
