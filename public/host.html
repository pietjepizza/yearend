<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mood Pulse · Presenter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app"></div>
<script src="/core.js"></script>
<script src="/icons.js"></script>
<script src="/fx.js"></script>
<script src="/transport-server.js"></script>
<script src="/help.js"></script>
<script src="/notes.js"></script>
<script src="/host.js"></script>
<script>
  const T = ServerTransport('host');
  T.notesUrl = () => location.href.split('#')[0] + '#notes';
  if (location.hash === '#notes') mountNotes(document.getElementById('app'), T); else mountHost(document.getElementById('app'), T);
  addEventListener('hashchange', () => location.reload());
</script>
</body>
</html>
